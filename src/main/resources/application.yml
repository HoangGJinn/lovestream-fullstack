spring:
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:my-cloud-placeholder}
  api-key: ${CLOUDINARY_API_KEY:my-api-key-placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:my-api-secret-placeholder}
