<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${success ? 'Kết quả thanh toán VNPay - LoveStream' : 'Thanh toán VNPay thất bại - LoveStream'}">
        Kết quả thanh toán VNPay - LoveStream
    </title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/packages.css">
</head>
<body>
<div class="payment-result">
    <div class="payment-result__card">
        <div class="payment-result__status">
            <span th:if="${success}" class="payment-result__icon payment-result__icon--success">
                <i class="fa-solid fa-circle-check"></i>
            </span>
            <span th:if="${!success}" class="payment-result__icon payment-result__icon--fail">
                <i class="fa-solid fa-circle-xmark"></i>
            </span>
            <div>
                <h1 class="payment-result__title"
                    th:text="${resultType == 'SUCCESS' ? 'Thanh toán thành công' : (resultType == 'CANCEL' ? 'Bạn đã hủy giao dịch' : 'Thanh toán thất bại')}">
                    Thanh toán
                </h1>
                <p class="payment-result__message" th:text="${message}">
                    Nội dung kết quả thanh toán
                </p>
            </div>
        </div>

        <div th:if="${success}" class="payment-result__grid">
            <div class="payment-result__label">Payment ID</div>
            <div th:text="${paymentId}">paymentId</div>

            <div class="payment-result__label">Mã giao dịch</div>
            <div th:text="${transactionCode}">transactionCode</div>

            <div class="payment-result__label">Gói dịch vụ</div>
            <div th:text="${planName}">planName</div>

            <div class="payment-result__label">Thời hạn</div>
            <div th:text="${durationDays + ' ngày'}">durationDays</div>

            <div class="payment-result__label">Số tiền</div>
            <div th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 0, 'POINT') + ' ₫'}">amount</div>
        </div>

        <div class="payment-result__actions">
            <a th:if="${success}" class="btn-purchase" th:href="@{/home}">
                <i class="fa-solid fa-play"></i> Xem phim ngay
            </a>
            <a th:if="${!success}" class="btn-purchase" th:href="@{/packages}">
                <i class="fa-solid fa-rotate-right"></i> Thử lại
            </a>
            <a class="btn-secondary" th:href="@{/home}">
                Quay về trang chủ
            </a>
            <a class="btn-secondary" th:href="@{/account/membership}">
                Tới trang thành viên
            </a>
        </div>
    </div>
</div>
</body>
</html>
