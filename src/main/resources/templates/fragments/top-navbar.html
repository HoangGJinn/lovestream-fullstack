<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<div th:fragment="topNavLeft(activeTab)" class="nav-left">
    <a href="/" class="logo">LoveStream</a>
    <ul class="nav-links">
        <li><a href="/home" th:classappend="${activeTab == 'home'} ? ' active' : ''">Trang chủ</a></li>
        <li>
            <a href="/series"
               th:classappend="${activeTab == 'series'} ? ' active' : ''">Series</a>
        </li>
        <li>
            <a href="/movies"
               th:classappend="${activeTab == 'movies'} ? ' active' : ''">Phim</a>
        </li>
        <li><a href="/videocontents/search" th:classappend="${activeTab == 'discover'} ? ' active' : ''">Mới &amp; Phổ biến</a></li>
        <li th:if="${currentUser != null}"><a href="/account/favorites" th:classappend="${activeTab == 'favorites'} ? ' active' : ''">Danh sách của tôi</a></li>
        <li th:if="${currentUser != null}"><a href="/history" th:classappend="${activeTab == 'history'} ? ' active' : ''">Lịch sử xem phim</a></li>
        <li><a href="/packages" th:classappend="${activeTab == 'packages'} ? ' active' : ''">Gói dịch vụ</a></li>
        <li th:if="${currentUser != null}"><a href="/watch-together" th:classappend="${activeTab == 'watch-together'} ? ' active' : ''">Xem chung</a></li>
    </ul>
    <script th:src="@{/js/movie-poster-transition.js}" defer></script>
    <script th:src="@{/js/search-suggest.js}" defer></script>
</div>

<form th:fragment="topNavSearch(formId, toggleId, inputId, actionUrl, placeholder, keyword, open, hiddenName, hiddenValue)"
      th:id="${formId}"
      class="nav-search"
      th:classappend="${open} ? ' is-open' : ''"
      th:action="${actionUrl}"
      method="get">
    <input th:if="${hiddenName != null and !#strings.isEmpty(hiddenName)}"
           type="hidden"
           th:name="${hiddenName}"
           th:value="${hiddenValue}">
    <button th:id="${toggleId}" class="nav-icon nav-search-toggle" type="button" aria-label="Tìm kiếm">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
    <input th:id="${inputId}" class="nav-search-input" name="keyword" type="text"
           th:placeholder="${placeholder}" th:value="${keyword}" autocomplete="off">

    <!-- Autocomplete dropdown (filled by /js/search-suggest.js) -->
    <div class="search-suggest-box" data-role="search-suggest-box"></div>
</form>
</body>
</html>
