<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveStream - Thong bao</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .notifications-page {
            padding: 96px 4% 40px;
            min-height: 100vh;
        }

        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .notifications-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .notifications-meta {
            margin: 6px 0 0;
            color: #b3b3b3;
            font-size: 0.95rem;
        }

        .notifications-filter {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-label {
            color: #e5e5e5;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .filter-select {
            background-color: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 12px;
            min-width: 180px;
        }

        .filter-btn {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .filter-btn:hover {
            border-color: #fff;
        }

        .mark-all-btn {
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 9px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .mark-all-btn:hover {
            background: #f6121d;
        }

        .notification-list {
            display: grid;
            gap: 14px;
        }

        .notification-card {
            background: #1f1f1f;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .notification-card--unread {
            border-color: #e50914;
            box-shadow: inset 0 0 0 1px rgba(229, 9, 20, 0.4);
        }

        .notification-main {
            min-width: 0;
        }

        .notification-top {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .notification-type {
            background: #333;
            color: #fff;
            border-radius: 999px;
            font-size: 0.72rem;
            padding: 3px 8px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .notification-time {
            color: #aaa;
            font-size: 0.8rem;
        }

        .notification-title {
            margin: 0 0 6px;
            font-size: 1.03rem;
        }

        .notification-content {
            margin: 0;
            color: #d0d0d0;
            line-height: 1.5;
            word-break: break-word;
        }

        .notification-actions {
            display: flex;
            align-items: center;
        }

        .mark-read-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .mark-read-btn:hover {
            border-color: #fff;
        }

        .status-read {
            color: #8f8f8f;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .empty-notifications {
            color: #b3b3b3;
            font-size: 1rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="navbar" id="navbar">
    <div class="nav-left">
        <a href="/" class="logo">LoveStream</a>
        <ul class="nav-links">
            <li><a href="/home">Trang chu</a></li>
            <li><a href="/series">Series</a></li>
            <li><a href="/movies">Phim</a></li>
            <li><a href="#">Moi & Pho bien</a></li>
            <li><a href="#">Danh sach cua toi</a></li>
        </ul>
    </div>
    <div class="nav-right">
        <a href="/notifications" class="nav-icon" aria-label="Thong bao"><i class="fa-regular fa-bell"></i></a>
        <div th:replace="~{fragments/user-menu :: userMenu(${currentUser}, 'dark')}"></div>
    </div>
</div>

<div class="notifications-page">
    <div class="notifications-header">
        <div>
            <h1 class="notifications-title">Thong bao</h1>
            <p class="notifications-meta" th:text="|Bạn có ${unreadCount} thông báo chưa đọc.|"></p>

            <form method="get" action="/notifications" class="notifications-filter">
                <label class="filter-label" for="filter">Lọc theo trạng thái</label>
                <select id="filter" name="filter" class="filter-select">
                    <option value="all" th:selected="${selectedFilter == 'all'}">Tất cả</option>
                    <option value="unread" th:selected="${selectedFilter == 'unread'}">Chưa đọc</option>
                    <option value="read" th:selected="${selectedFilter == 'read'}">Đã đọc</option>
                </select>
                <button class="filter-btn" type="submit">Áp dụng</button>
            </form>
        </div>
        <form method="post" action="/notifications/read-all" th:if="${unreadCount > 0}">
            <input type="hidden" name="filter" th:value="${selectedFilter}">
            <button class="mark-all-btn" type="submit">Đánh dấu tất cả đã đọc</button>
        </form>
    </div>

    <div class="notification-list" th:if="${not #lists.isEmpty(notifications)}">
        <div class="notification-card" th:each="notification : ${notifications}"
             th:classappend="${notification.status.name() == 'UNREAD'} ? ' notification-card--unread' : ''">
            <div class="notification-main">
                <div class="notification-top">
                    <span class="notification-type" th:text="${notification.type}"></span>
                    <span class="notification-time" th:text="${#temporals.format(notification.sentAt, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <h3 class="notification-title" th:text="${notification.title}"></h3>
                <p class="notification-content" th:text="${notification.content}"></p>
            </div>
            <div class="notification-actions">
                <form th:if="${notification.status.name() == 'UNREAD'}" method="post"
                      th:action="@{|/notifications/${notification.id}/read|}">
                    <input type="hidden" name="filter" th:value="${selectedFilter}">
                    <button class="mark-read-btn" type="submit">Đánh dấu đã đọc</button>
                </form>
                <span class="status-read" th:if="${notification.status.name() != 'UNREAD'}">Đã đọc</span>
            </div>
        </div>
    </div>

    <p class="empty-notifications" th:if="${#lists.isEmpty(notifications)}">Bạn chưa có thông báo nào.</p>
</div>

<script>
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });
</script>
</body>
</html>
