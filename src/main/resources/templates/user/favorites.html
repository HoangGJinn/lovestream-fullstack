<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phim yêu thích - LoveStream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .favorites-filter {
            display: grid;
            grid-template-columns: minmax(240px, 1fr) 180px 220px auto auto;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-input,
        .filter-select {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            height: 42px;
            padding: 0 12px;
            font-size: 14px;
            background: #fff;
            color: #111827;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #e50914;
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.12);
            outline: none;
        }

        .filter-btn,
        .filter-btn--ghost {
            height: 42px;
            border-radius: 6px;
            padding: 0 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .filter-btn {
            border: none;
            background: #e50914;
            color: #fff;
            min-width: 110px;
        }

        .filter-btn:hover {
            background: #c90812;
        }

        .filter-btn--ghost {
            border: 1px solid #d1d5db;
            background: #fff;
            color: #111827;
            min-width: 90px;
        }

        .filter-btn--ghost:hover {
            background: #f9fafb;
        }

        .favorite-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
        }

        .favorite-card {
            width: 185px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        .favorite-card:hover {
            transform: translateY(-4px);
        }

        .favorite-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .favorite-poster {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .favorite-content {
            padding: 12px;
        }

        .favorite-title {
            margin: 0 0 5px 0;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .favorite-meta {
            margin: 0;
            font-size: 13px;
            color: #666;
        }

        .favorite-actions {
            padding: 0 12px 12px 12px;
        }

        .btn-remove {
            width: 100%;
            padding: 8px;
            background: #fcebeb;
            color: #d90000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-remove:hover {
            background: #f6d6d6;
        }

        .empty-box {
            width: 100%;
            text-align: center;
            padding: 40px;
            border: 2px dashed #e6e6e6;
            border-radius: 8px;
            background: #fff;
        }

        .vip-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            width: 100%;
        }

        @media (max-width: 1000px) {
            .favorites-filter {
                grid-template-columns: 1fr 1fr;
            }

            .filter-btn,
            .filter-btn--ghost {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .favorites-filter {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div style="height: 70px; display: flex; align-items: center; padding: 0 40px; border-bottom: 1px solid #e5e5e5; background: #fff;">
    <a href="/home" style="color: #e50914; font-size: 28px; font-weight: 900; text-decoration: none; letter-spacing: -1px;">LoveStream</a>
    <div style="margin-left: auto;" th:insert="~{fragments/user-menu :: userMenu(${currentUser}, 'light')}"></div>
</div>

<div class="profile-container">
    <div th:replace="~{fragments/account-sidebar :: sidebar('favorites')}"></div>

    <div class="main-content">
        <h1 class="page-title">Phim Yêu Thích Của Tôi</h1>
        <p class="page-subtitle">Danh sách những bộ phim bạn đã lưu lại</p>

        <form id="favoritesFilterForm" class="favorites-filter">
            <input id="keywordFilter" name="keyword" class="filter-input" type="text" placeholder="Tìm theo tên phim...">

            <select id="yearFilter" name="year" class="filter-select">
                <option value="">Tất cả năm</option>
            </select>

            <select id="genreFilter" name="genre" class="filter-select">
                <option value="">Tất cả thể loại</option>
                <option th:each="genre : ${genres}" th:value="${genre.name}" th:text="${genre.name}">Action</option>
            </select>

            <button type="submit" class="filter-btn"><i class="fa-solid fa-filter"></i> Áp dụng</button>
            <button type="button" id="clearFilterBtn" class="filter-btn--ghost">Xóa lọc</button>
        </form>

        <div id="favorite-movies-container" class="favorite-grid">
            <p style="color: #666; font-size: 14px;">Đang tải danh sách phim...</p>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('favorite-movies-container');
    const filterForm = document.getElementById('favoritesFilterForm');
    const keywordFilter = document.getElementById('keywordFilter');
    const yearFilter = document.getElementById('yearFilter');
    const genreFilter = document.getElementById('genreFilter');
    const clearFilterBtn = document.getElementById('clearFilterBtn');

    function escapeHtml(text) {
        return String(text ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function renderMovies(movies) {
        if (!movies || movies.length === 0) {
            container.innerHTML = `
                <div class="empty-box">
                    <i class="fa-regular fa-folder-open" style="font-size: 55px; color: #ccc; margin-bottom: 15px;"></i>
                    <p style="color: #666; font-size: 16px; margin: 0;">Không tìm thấy phim phù hợp với bộ lọc hiện tại.</p>
                </div>`;
            return;
        }

        const html = movies.map(movie => {
            const detailUrl = `/movies/${movie.videoId}`;
            return `
                <div class="favorite-card">
                    <a href="${detailUrl}" class="favorite-link">
                        <img src="${escapeHtml(movie.posterUrl)}" alt="${escapeHtml(movie.title)}" class="favorite-poster">
                        <div class="favorite-content">
                            <h4 class="favorite-title" title="${escapeHtml(movie.title)}">${escapeHtml(movie.title)}</h4>
                            <p class="favorite-meta">${escapeHtml(movie.releaseYear)} • ⭐ ${(movie.rating || 0).toFixed(1)}</p>
                        </div>
                    </a>
                    <div class="favorite-actions">
                        <button onclick="removeFav('${escapeHtml(movie.videoId)}')" class="btn-remove">
                            <i class="fa-solid fa-trash"></i> Bỏ yêu thích
                        </button>
                    </div>
                </div>`;
        }).join('');

        container.innerHTML = html;
    }

    function ensureYearOptions(movies) {
        const years = [...new Set((movies || []).map(m => m.releaseYear).filter(Boolean))]
            .sort((a, b) => b - a);

        const currentValue = yearFilter.value;
        yearFilter.innerHTML = '<option value="">Tất cả năm</option>';
        years.forEach(year => {
            const option = document.createElement('option');
            option.value = String(year);
            option.textContent = String(year);
            yearFilter.appendChild(option);
        });

        if (currentValue && years.map(String).includes(currentValue)) {
            yearFilter.value = currentValue;
        }
    }

    async function loadFavorites(params = {}, buildYearOptions = false) {
        const query = new URLSearchParams();
        if (params.keyword) query.set('keyword', params.keyword);
        if (params.year) query.set('year', params.year);
        if (params.genre) query.set('genre', params.genre);

        const endpoint = query.toString() ? `/api/favorites?${query.toString()}` : '/api/favorites';

        container.innerHTML = '<p style="color: #666; font-size: 14px;">Đang tải danh sách phim...</p>';

        try {
            const response = await fetch(endpoint, { method: 'GET' });
            const result = await response.json();

            if (response.ok) {
                const movies = result.data || [];
                if (buildYearOptions) {
                    ensureYearOptions(movies);
                }

                if (result.status === 'empty') {
                    container.innerHTML = `
                        <div class="empty-box">
                            <i class="fa-regular fa-folder-open" style="font-size: 55px; color: #ccc; margin-bottom: 15px;"></i>
                            <p style="color: #666; font-size: 16px;">${escapeHtml(result.message || 'Danh sách yêu thích của bạn đang trống.')}</p>
                            <a href="/movies" style="display: inline-block; margin-top: 15px; color: #e50914; font-weight: bold; text-decoration: none; border: 1px solid #e50914; padding: 10px 20px; border-radius: 5px;">Khám phá phim ngay →</a>
                        </div>`;
                    return;
                }

                renderMovies(movies);
                return;
            }

            container.innerHTML = `
                <div class="vip-box">
                    <h3 style="margin-top:0;">🔒 Tính năng dành riêng cho Hội Viên</h3>
                    <p>${escapeHtml(result.message || 'Hãy nâng cấp gói dịch vụ để truy cập danh sách yêu thích.')}</p>
                    <a href="/account/membership" style="display: inline-block; background: #e50914; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight:bold; margin-top: 10px;">Đăng ký gói ngay</a>
                </div>`;
        } catch (error) {
            container.innerHTML = '<p style="color: #b42318;">Lỗi kết nối máy chủ. Vui lòng thử lại sau.</p>';
        }
    }

    filterForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        await loadFavorites({
            keyword: keywordFilter.value.trim(),
            year: yearFilter.value,
            genre: genreFilter.value
        });
    });

    clearFilterBtn.addEventListener('click', async function () {
        keywordFilter.value = '';
        yearFilter.value = '';
        genreFilter.value = '';
        await loadFavorites({}, true);
    });

    window.removeFav = async function (videoId) {
        if (!confirm('Bạn có chắc chắn muốn xóa phim này khỏi danh sách yêu thích?')) {
            return;
        }

        try {
            const response = await fetch(`/api/favorites/${videoId}`, { method: 'DELETE' });
            const params = {
                keyword: keywordFilter.value.trim(),
                year: yearFilter.value,
                genre: genreFilter.value
            };

            if (response.ok) {
                await loadFavorites(params);
                return;
            }

            alert('Đã có lỗi xảy ra khi xóa phim.');
        } catch (error) {
            alert('Lỗi kết nối mạng!');
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await loadFavorites({}, true);
    });
</script>

</body>
</html>
