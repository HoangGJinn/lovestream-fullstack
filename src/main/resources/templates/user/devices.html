<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết bị - LoveStream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .devices-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .devices-subtitle {
            margin: 0 0 20px;
            color: #4b5563;
            line-height: 1.5;
        }

        .refresh-btn {
            border: 1px solid #d1d5db;
            background: #fff;
            color: #111827;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .refresh-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .device-list {
            display: grid;
            gap: 14px;
        }

        .device-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            padding: 14px 16px;
        }

        .device-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .device-title {
            margin: 0;
            color: #111827;
            font-size: 21px;
            line-height: 1.3;
            font-weight: 700;
        }

        .current-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            color: #1d4ed8;
            background: #dbeafe;
            font-weight: 700;
        }

        .device-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4b5563;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stream-state {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .stream-state--playing {
            color: #047857;
        }

        .stream-state--idle {
            color: #6b7280;
        }

        .logout-device-btn {
            width: 100%;
            border: 1px solid #d1d5db;
            background: #fff;
            color: #111827;
            border-radius: 6px;
            padding: 9px 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .logout-device-btn:hover {
            background: #f9fafb;
        }

        .empty-state {
            border: 1px dashed #d1d5db;
            border-radius: 10px;
            background: #fff;
            color: #6b7280;
            padding: 20px;
            text-align: center;
        }

        .loading-state {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            color: #374151;
            padding: 20px;
            text-align: center;
            font-weight: 600;
        }

        .status-text {
            margin-top: 14px;
            font-size: 14px;
        }

        .status-text--ok {
            color: #047857;
        }

        .status-text--error {
            color: #b91c1c;
        }
    </style>
</head>
<body>

<div style="height: 70px; display: flex; align-items: center; padding: 0 40px; border-bottom: 1px solid #e5e5e5; background: #fff;">
    <a href="/home" style="color: #e50914; font-size: 28px; font-weight: 900; text-decoration: none; letter-spacing: -1px;">LoveStream</a>
    <div style="margin-left: auto;" th:insert="~{fragments/user-menu :: userMenu(${currentUser}, 'light')}"></div>
</div>

<div class="profile-container">
    <div th:replace="~{fragments/account-sidebar :: sidebar('devices')}"></div>

    <div class="main-content">
        <div class="devices-header">
            <h1 class="page-title" style="margin: 0;">Quản lý quyền truy cập và thiết bị</h1>
            <button type="button" id="refreshDevicesBtn" class="refresh-btn">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>
        <p class="devices-subtitle">
            Xem các thiết bị đã đăng nhập gần đây, thời điểm hoạt động cuối và trạng thái đang xem phim.
            Bạn có thể đăng xuất từng thiết bị từ màn hình này.
        </p>

        <div id="deviceList" class="device-list"></div>
        <p id="deviceStatusText" class="status-text" style="display: none;"></p>
    </div>
</div>

<script>
    (function () {
        const DEVICE_STORAGE_KEY = 'lovestream_device_id';
        const listEl = document.getElementById('deviceList');
        const statusText = document.getElementById('deviceStatusText');
        const refreshBtn = document.getElementById('refreshDevicesBtn');

        function buildFallbackDeviceId() {
            return 'device-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        }

        function syncDeviceCookie(deviceId) {
            const maxAge = 60 * 60 * 24 * 365;
            document.cookie = 'DEVICE_ID=' + encodeURIComponent(deviceId) + '; path=/; max-age=' + maxAge + '; SameSite=Lax';
        }

        function getOrCreateDeviceId() {
            try {
                const existing = localStorage.getItem(DEVICE_STORAGE_KEY);
                if (existing && existing.trim()) {
                    const deviceId = existing.trim();
                    syncDeviceCookie(deviceId);
                    return deviceId;
                }
            } catch (_error) {}

            const generated = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
                ? crypto.randomUUID()
                : buildFallbackDeviceId();
            try {
                localStorage.setItem(DEVICE_STORAGE_KEY, generated);
            } catch (_error) {}
            syncDeviceCookie(generated);
            return generated;
        }

        function formatLastLogin(value) {
            if (!value) return 'Không có dữ liệu';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Không có dữ liệu';
            return date.toLocaleString('vi-VN');
        }

        function setStatus(message, isError) {
            if (!message) {
                statusText.style.display = 'none';
                statusText.textContent = '';
                return;
            }
            statusText.style.display = 'block';
            statusText.className = 'status-text ' + (isError ? 'status-text--error' : 'status-text--ok');
            statusText.textContent = message;
        }

        async function touchCurrentDevice(deviceId) {
            await fetch('/api/v1/devices/touch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId })
            });
        }

        function renderDevices(items, currentDeviceId) {
            if (!items || items.length === 0) {
                listEl.innerHTML = '<div class="empty-state">Chưa có dữ liệu thiết bị đăng nhập.</div>';
                return;
            }

            listEl.innerHTML = items.map(item => {
                const isCurrent = !!item.currentDevice || item.deviceId === currentDeviceId;
                const deviceIconClass = resolveDeviceIconClass(item);
                const streamClass = item.streaming ? 'stream-state stream-state--playing' : 'stream-state stream-state--idle';
                const streamText = item.streaming ? 'Đang xem phim' : 'Không có hoạt động để hiển thị';
                const streamIcon = item.streaming ? 'fa-circle-play' : 'fa-user-clock';
                const logoutButton = isCurrent || !item.active
                    ? ''
                    : '<button type="button" class="logout-device-btn" data-device-id="' + item.deviceId + '">Đăng xuất thiết bị</button>';
                const activeText = item.active ? '' : '<div class="stream-state stream-state--idle"><i class="fa-solid fa-user-slash"></i><span>Thiết bị đã đăng xuất</span></div>';

                return (
                    '<article class="device-card">' +
                        '<div class="device-title-row">' +
                            '<h2 class="device-title"><i class="fa-solid ' + deviceIconClass + '" style="margin-right: 8px;"></i>' + escapeHtml(item.deviceName || 'Thiết bị') + '</h2>' +
                            (isCurrent ? '<span class="current-badge">Thiết bị hiện tại</span>' : '') +
                        '</div>' +
                        '<div class="device-meta"><i class="fa-regular fa-clock"></i><span>Lần cuối đăng nhập: ' + escapeHtml(formatLastLogin(item.lastLogin)) + '</span></div>' +
                        '<div class="device-meta"><i class="fa-solid fa-laptop-code"></i><span>Hệ điều hành: ' + escapeHtml(item.os || 'Không rõ') + '</span></div>' +
                        '<div class="' + streamClass + '"><i class="fa-solid ' + streamIcon + '"></i><span>' + streamText + '</span></div>' +
                        activeText +
                        logoutButton +
                    '</article>'
                );
            }).join('');
        }

        function renderLoading(text) {
            const message = text || 'Đang tải danh sách thiết bị...';
            listEl.innerHTML =
                '<div class="loading-state">' +
                    '<i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i>' +
                    message +
                '</div>';
        }

        function resolveDeviceIconClass(item) {
            const os = String(item && item.os ? item.os : '').toLowerCase();
            const name = String(item && item.deviceName ? item.deviceName : '').toLowerCase();

            if (name.includes('tv')) return 'fa-tv';
            if (os.includes('ios') || name.includes('iphone') || name.includes('ipad')) return 'fa-mobile-screen';
            if (os.includes('android') || name.includes('android')) return 'fa-mobile-screen';
            if (os.includes('windows') || os.includes('mac') || os.includes('linux')) return 'fa-laptop';
            return 'fa-desktop';
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function loadDevices() {
            refreshBtn.disabled = true;
            setStatus('', false);
            const currentDeviceId = getOrCreateDeviceId();
            renderLoading('Đang tải danh sách thiết bị...');

            try {

                const response = await fetch('/api/v1/devices/me?deviceId=' + encodeURIComponent(currentDeviceId) + '&includeStreaming=false');
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.error || 'Không thể tải danh sách thiết bị.');
                }

                renderDevices(payload.items || [], currentDeviceId);
                fetch('/api/v1/devices/me?deviceId=' + encodeURIComponent(currentDeviceId) + '&includeStreaming=true')
                    .then(resp => resp.ok ? resp.json() : null)
                    .then(data => {
                        if (data && data.items) {
                            renderDevices(data.items, currentDeviceId);
                        }
                    })
                    .catch(() => {});
            } catch (error) {
                listEl.innerHTML = '<div class="empty-state">Không thể tải danh sách thiết bị.</div>';
                setStatus(error.message || 'Có lỗi xảy ra khi tải dữ liệu.', true);
            } finally {
                refreshBtn.disabled = false;
            }
        }

        async function logoutDevice(deviceId) {
            const currentDeviceId = getOrCreateDeviceId();
            if (!deviceId) return;
            if (!confirm('Bạn có chắc muốn đăng xuất thiết bị này không?')) return;

            try {
                const response = await fetch(
                    '/api/v1/devices/' + encodeURIComponent(deviceId) + '/logout?currentDeviceId=' + encodeURIComponent(currentDeviceId),
                    { method: 'POST' }
                );
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.error || 'Không thể đăng xuất thiết bị.');
                }
                setStatus(payload.message || 'Đã đăng xuất thiết bị.', false);
                await loadDevices();
            } catch (error) {
                setStatus(error.message || 'Đăng xuất thiết bị thất bại.', true);
            }
        }

        refreshBtn.addEventListener('click', loadDevices);

        listEl.addEventListener('click', (event) => {
            const button = event.target.closest('.logout-device-btn');
            if (!button) return;
            logoutDevice(button.getAttribute('data-device-id'));
        });

        loadDevices();
    })();
</script>

</body>
</html>
