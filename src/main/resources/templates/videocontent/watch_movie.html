<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix Player - Chi tiết Điều khiển</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #000;
            --control-bg: rgba(0, 0, 0, 0.7);
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Roboto', sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Container cho toàn bộ trình phát */
        .video-player {
            position: relative;
            width: 100%;
            height: 80vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Thẻ video (ẩn điều khiển mặc định) */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Tránh tương tác trực tiếp, để JS xử lý click container */
        }

        /* Overlay chính chứa toàn bộ điều khiển */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px; /* Tăng độ cao để thanh tiến trình nằm trên */
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 40px;
            box-sizing: border-box;
            opacity: 0; /* Ẩn đi mặc định */
            transition: opacity 0.3s;
            z-index: 10;
            pointer-events: none;
        }

        /* Hiển thị overlay khi có tương tác hoặc đang pause */
        .video-player.user-active .controls-overlay,
        .video-player.paused-state .controls-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1. Thanh tiến trình (ProgressBar) nằm riêng biệt phía trên */
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            border-radius: 5px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-container:hover {
            height: 8px; /* Phóng to khi hover để dễ thao tác */
            bottom: -2px;
        }

        .current-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--primary-color);
            border-radius: 5px;
            width: 0%;
        }

        /* Thời gian */
        .time-display {
            position: absolute;
            top: -20px; /* Nằm trên thanh tiến trình */
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.9rem;
            color: #ddd;
        }

        /* 2. Thanh nút điều khiển chính */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Nhóm các nút (bên trái/bên phải) */
        .control-group {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Nút chung */
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.1s;
        }

        .control-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Nút Play/Pause lớn hơn */
        #playPauseBtn {
            font-size: 2.5rem;
        }

        /* Thanh âm lượng */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #volumeSlider {
            width: 100px;
            cursor: pointer;
        }

        .settings-control {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-menu {
            position: absolute;
            bottom: 52px;
            right: 0;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-width: 220px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
        }

        .settings-control.open .settings-menu {
            display: flex;
        }

        .settings-panel {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .settings-panel.active {
            display: flex;
        }

        .settings-entry {
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .settings-entry:hover,
        .settings-entry.active {
            background: var(--primary-color);
        }

        .settings-entry.disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .settings-entry.disabled:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .settings-entry-label {
            flex: 1;
            text-align: left;
        }

        .settings-entry-value {
            font-size: 0.84rem;
            opacity: 0.9;
        }

        .settings-option {
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            text-align: left;
            cursor: pointer;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
        }

        .settings-option:hover,
        .settings-option.active {
            background: var(--primary-color);
        }

        .setting-summary {
            font-size: 0.85rem;
            min-width: 46px;
            opacity: 0.9;
            display: none;
        }

        .settings-subtitle {
            font-size: 0.8rem;
            opacity: 0.75;
            margin: 0 0 4px;
            padding: 0 2px;
        }

        .settings-back {
            text-align: left;
        }

        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1s linear infinite;
            z-index: 10;
        }

        .hidden {
            display: none;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ====== Movie Info Bar ====== */
        .movie-compact-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 100%);
            border-top: 2px solid var(--primary-color);
            flex-wrap: wrap;
            gap: 16px;
        }

        .compact-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 0;
        }

        .c-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .compact-right {
            display: flex;
            align-items: center;
        }

        .action-buttons-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #bbb;
            font-size: 0.8rem;
            transition: color 0.2s, transform 0.15s;
            user-select: none;
        }

        .action-item:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .action-item i {
            font-size: 1.4rem;
        }

        .rating-badge-blue {
            display: flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(26,115,232,0.4);
        }

        .rating-badge-blue i {
            color: #ffd700;
            font-size: 1rem;
        }

        .rating-badge-blue small {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.75rem;
        }

        /* ====== Comment Section ====== */
        .comment-zone {
            padding: 30px 40px;
            background: #0d0d0d;
        }

        .comment-zone h2 {
            margin: 0 0 16px;
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comment-zone h2 i {
            color: var(--primary-color);
        }

        .comment-login-notice {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 14px;
        }

        .comment-login-notice a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .comment-login-notice a:hover {
            text-decoration: underline;
        }

        .comment-input-area {
            position: relative;
            margin-bottom: 10px;
        }

        .comment-input-area textarea {
            width: 100%;
            min-height: 90px;
            padding: 14px 16px;
            padding-bottom: 36px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Roboto', sans-serif;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .comment-input-area textarea:focus {
            border-color: var(--primary-color);
        }

        .comment-input-area textarea::placeholder {
            color: #666;
        }

        .comment-input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            bottom: 10px;
            left: 16px;
            right: 16px;
        }

        .char-counter {
            color: #666;
            font-size: 0.8rem;
        }

        .btn-send-comment {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.2s;
        }

        .btn-send-comment:hover {
            opacity: 0.8;
        }

        .comment-error {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }

        .comment-success {
            color: #4caf50;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }

        /* ====== Tabs ====== */
        .tab-group {
            display: inline-flex;
            border: 1px solid #555;
            border-radius: 6px;
            overflow: hidden;
            margin-left: 14px;
        }

        .tab-btn {
            padding: 5px 16px;
            background: transparent;
            color: #ccc;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #fff;
            color: #000;
            font-weight: 600;
        }

        .tab-btn:not(.active):hover {
            background: rgba(255,255,255,0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ====== Comment Item ====== */
        .comment-list {
            margin-top: 16px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b6914, #c9a84c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }

        .comment-body {
            flex: 1;
        }

        .comment-user-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #eee;
            margin-bottom: 4px;
        }

        .comment-text {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.4;
        }

        .comment-date {
            font-size: 0.75rem;
            color: #666;
            margin-top: 6px;
        }

        .no-data-msg {
            color: #666;
            font-size: 0.9rem;
            padding: 20px 0;
        }

        /* ====== Reply ====== */
        .comment-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
        }

        .reply-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0;
            transition: color 0.2s;
        }

        .reply-btn:hover {
            color: var(--primary-color);
        }

        .reply-btn i {
            font-size: 0.75rem;
        }

        .reply-box {
            display: none;
            margin-top: 10px;
        }

        .reply-box.show {
            display: block;
        }

        .reply-box textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            font-family: 'Roboto', sans-serif;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        .reply-box textarea:focus {
            border-color: var(--primary-color);
        }

        .reply-box-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            gap: 8px;
        }

        .btn-send-reply {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 5px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel-reply {
            background: none;
            color: #888;
            border: 1px solid #555;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .reply-list {
            margin-top: 10px;
            padding-left: 52px;
        }

        .reply-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-left: 2px solid rgba(255,255,255,0.1);
            padding-left: 12px;
            margin-bottom: 4px;
        }

        .reply-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #555, #777);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #fff;
            flex-shrink: 0;
        }

        .reply-body {
            flex: 1;
        }

        .reply-user-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: #ccc;
        }

        .reply-text {
            font-size: 0.82rem;
            color: #aaa;
            line-height: 1.4;
            margin-top: 2px;
        }

        .reply-date {
            font-size: 0.7rem;
            color: #555;
            margin-top: 3px;
        }

        /* ====== Rating Item ====== */
        .rating-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            align-items: flex-start;
        }

        .rating-stars-display {
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        /* ====== Star Rating Modal ====== */
        .rating-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .rating-modal-overlay.show {
            display: flex;
        }

        .rating-modal {
            background: linear-gradient(145deg, #1e1e3a, #2a2a50);
            border-radius: 16px;
            padding: 32px 36px;
            width: 440px;
            max-width: 90vw;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .rating-modal-close {
            position: absolute;
            top: 14px; right: 16px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .rating-modal-close:hover {
            color: #fff;
        }

        .rating-modal h3 {
            margin: 0 0 8px;
            font-size: 1.3rem;
            color: #fff;
        }

        .rating-modal-avg {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .rating-modal-avg i {
            color: #ffd700;
        }

        .star-picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            background: rgba(0,0,0,0.25);
            padding: 20px;
            border-radius: 12px;
        }

        .star-picker-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s;
            padding: 8px;
        }

        .star-picker-item:hover {
            transform: scale(1.15);
        }

        .star-picker-item.selected .star-icon {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255,215,0,0.5);
        }

        .star-icon {
            font-size: 2rem;
            color: #555;
            transition: color 0.2s;
        }

        .star-label {
            font-size: 0.7rem;
            color: #aaa;
        }

        .rating-modal-btns {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-submit-rating {
            background: #f5c518;
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit-rating:hover {
            background: #e0b415;
        }

        .btn-close-rating {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid #555;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close-rating:hover {
            background: rgba(255,255,255,0.2);
        }

        .rating-modal-msg {
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .review-textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-family: 'Roboto', sans-serif;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            margin-top: 4px;
        }

        .review-textarea:focus {
            border-color: var(--primary-color);
        }

        .review-textarea::placeholder {
            color: #666;
        }

        .review-text {
            font-size: 0.85rem;
            color: #bbb;
            margin-top: 4px;
            line-height: 1.4;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .movie-compact-bar {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
            .c-title {
                font-size: 1.1rem;
            }
            .comment-zone {
                padding: 20px 16px;
            }
            .rating-modal {
                padding: 24px 18px;
            }
            .star-picker {
                gap: 6px;
                padding: 14px;
            }
            .star-icon {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="video-player" id="player">
    <video id="video"></video>
    <div id="loadingSpinner" class="spinner hidden"></div>
    <div class="controls-overlay" id="controlsOverlay">

        <div class="progress-bar-container" id="progressBarContainer">
            <div class="time-display">
                <span id="currentTime">00:00</span>
                <span id="duration">--:--</span>
            </div>
            <div class="current-progress" id="currentProgress"></div>
        </div>

        <div class="controls-row">

            <div class="control-group central-controls">
                <button class="control-btn" id="rewindBtn"><i class="fas fa-undo-alt"></i></button>
                <button class="control-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="forwardBtn"><i class="fas fa-redo-alt"></i></button>
                <div class="volume-container">
                    <button class="control-btn" id="muteBtn"><i class="fas fa-volume-up"></i></button>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                </div>
            </div>

            <div class="control-group right-controls">
                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                <button class="control-btn" id="pipBtn"><i class="fas fa-external-link-alt"></i></button>
                <div class="settings-control" id="settingsControl">
                    <button class="control-btn" id="settingsBtn" title="Tốc độ phát">
                        <i class="fas fa-cog"></i>
                    </button>
                    <span class="setting-summary" id="speedSummary">1x</span>
                    <span class="setting-summary" id="qualitySummary">Auto</span>
                    <div class="settings-menu" id="settingsMenu">
                        <div class="settings-panel active" id="settingsMenuRoot">
                            <button class="settings-entry" id="openSpeedMenuBtn" type="button">
                                <span class="settings-entry-label">Tốc độ phát</span>
                                <span class="settings-entry-value" id="speedValueLabel">1x</span>
                            </button>
                            <button class="settings-entry" id="openQualityMenuBtn" type="button">
                                <span class="settings-entry-label">Chất lượng</span>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script th:inline="javascript">
    const video = document.getElementById('video');
    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const currentProgress = document.getElementById('currentProgress');
    const currentTimeDisplay = document.getElementById('currentTime');
    const durationDisplay = document.getElementById('duration');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const controlsOverlay = document.getElementById('controlsOverlay');
    const settingsControl = document.getElementById('settingsControl');
    const settingsMenuRoot = document.getElementById('settingsMenuRoot');
    const settingsSpeedMenu = document.getElementById('settingsSpeedMenu');
    const settingsQualityMenu = document.getElementById('settingsQualityMenu');
    const openSpeedMenuBtn = document.getElementById('openSpeedMenuBtn');
    const openQualityMenuBtn = document.getElementById('openQualityMenuBtn');
    const backFromSpeedBtn = document.getElementById('backFromSpeedBtn');
    const backFromQualityBtn = document.getElementById('backFromQualityBtn');
    const speedSummary = document.getElementById('speedSummary');
    const speedValueLabel = document.getElementById('speedValueLabel');
    const qualitySummary = document.getElementById('qualitySummary');
    const qualityValueLabel = document.getElementById('qualityValueLabel');
    const qualityOptionsContainer = document.getElementById('qualityOptions');
    const speedOptions = document.querySelectorAll('.settings-option[data-speed]');

    const spinner = document.getElementById('loadingSpinner');
    const fallbackVideoId = /*[[${id}]]*/ '';
    const queryParams = new URLSearchParams(window.location.search);
    const videoContentId = queryParams.get('id') || fallbackVideoId;
    const startSecondsParam = Number(queryParams.get('start'));
    const resumeStartSeconds = Number.isFinite(startSecondsParam) && startSecondsParam > 0 ? startSecondsParam : 0;
    let hls; // ✅ FIX: đưa ra global
    let selectedManualLevel = null;
    let isAutoQuality = true;
    const CONTROL_HIDE_DELAY_MS = 2500;
    let controlsHideTimer = null;
    let lastHistorySyncAt = 0;
    const HISTORY_SYNC_INTERVAL_MS = 12000;
    let hasAppliedResume = false;

    // Khi đang load dữ liệu
    video.addEventListener('waiting', () => {
        spinner.classList.remove('hidden');
    });

    // Khi đã load xong và có thể play
    video.addEventListener('playing', () => {
        spinner.classList.add('hidden');
    });

    function clearControlsHideTimer() {
        if (controlsHideTimer) {
            clearTimeout(controlsHideTimer);
            controlsHideTimer = null;
        }
    }

    function hideControlsIfIdle() {
        if (settingsControl.classList.contains('open') || video.paused) {
            return;
        }
        player.classList.remove('user-active');
    }

    function scheduleControlsHide() {
        clearControlsHideTimer();
        controlsHideTimer = setTimeout(hideControlsIfIdle, CONTROL_HIDE_DELAY_MS);
    }

    function showControls() {
        player.classList.add('user-active');
        if (!video.paused && !settingsControl.classList.contains('open')) {
            scheduleControlsHide();
        }
    }

    function syncPauseState() {
        if (video.paused) {
            player.classList.add('paused-state');
            player.classList.add('user-active');
            clearControlsHideTimer();
        } else {
            player.classList.remove('paused-state');
            scheduleControlsHide();
        }
    }

    player.addEventListener('mousemove', showControls);
    player.addEventListener('mouseenter', showControls);
    player.addEventListener('mouseleave', () => {
        clearControlsHideTimer();
        if (!video.paused) {
            player.classList.remove('user-active');
        }
    });
    controlsOverlay.addEventListener('mousemove', showControls);


    // Khi tua xong
    video.addEventListener('seeked', () => {
        spinner.classList.add('hidden');

        video.play().catch(() => {});
    });

    // --- Play/Pause ---
    function togglePlay() {
        if (video.paused) {
            video.play();
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            video.pause();
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
        syncPauseState();
    }

    player.addEventListener('click', (e) => {
        if (e.target === player || e.target === video) togglePlay();
    });
    playPauseBtn.addEventListener('click', togglePlay);

    // --- Tua 10s ---
    rewindBtn.addEventListener('click', () => { video.currentTime -= 10; });
    forwardBtn.addEventListener('click', () => { video.currentTime += 10; });

    // --- Volume ---
    volumeSlider.addEventListener('input', (e) => {
        video.volume = e.target.value;
        video.muted = false;
        muteBtn.innerHTML = video.volume > 0
            ? '<i class="fas fa-volume-up"></i>'
            : '<i class="fas fa-volume-mute"></i>';
    });

    muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted
            ? '<i class="fas fa-volume-mute"></i>'
            : '<i class="fas fa-volume-up"></i>';
    });

    // --- Fullscreen ---
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            player.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });

    // --- Settings menu ---
    const allSettingsPanels = [settingsMenuRoot, settingsSpeedMenu, settingsQualityMenu];

    function showSettingsPanel(panel) {
        allSettingsPanels.forEach(item => item.classList.remove('active'));
        panel.classList.add('active');
    }

    function openSettingsMenu(panel = settingsMenuRoot) {
        settingsControl.classList.add('open');
        showSettingsPanel(panel);
        showControls();
        clearControlsHideTimer();
    }

    function closeSettingsMenu() {
        settingsControl.classList.remove('open');
        showSettingsPanel(settingsMenuRoot);
        if (!video.paused) {
            scheduleControlsHide();
        }
    }

    settingsBtn.addEventListener('click', () => {
        if (settingsControl.classList.contains('open')) {
            closeSettingsMenu();
            return;
        }
        openSettingsMenu(settingsMenuRoot);
    });

    openSpeedMenuBtn.addEventListener('click', () => showSettingsPanel(settingsSpeedMenu));

    openQualityMenuBtn.addEventListener('click', () => {
        if (openQualityMenuBtn.classList.contains('disabled')) {
            return;
        }
        showSettingsPanel(settingsQualityMenu);
    });

    backFromSpeedBtn.addEventListener('click', () => showSettingsPanel(settingsMenuRoot));
    backFromQualityBtn.addEventListener('click', () => showSettingsPanel(settingsMenuRoot));

    document.addEventListener('click', (event) => {
        if (!settingsControl.contains(event.target)) {
            closeSettingsMenu();
        }
    });

    // --- Speed ---
    function setPlaybackSpeed(speed) {
        video.playbackRate = speed;
        const speedText = speed + 'x';
        speedSummary.textContent = speedText;
        speedValueLabel.textContent = speedText;
        speedOptions.forEach(option => {
            option.classList.toggle('active', Number(option.dataset.speed) === speed);
        });
    }

    speedOptions.forEach(option => {
        option.addEventListener('click', () => {
            setPlaybackSpeed(Number(option.dataset.speed));
            closeSettingsMenu();
        });
    });

    setPlaybackSpeed(1);
    syncPauseState();

    // --- Quality ---
    function getQualityLabel(level) {
        if (!level) return 'Unknown';
        if (level.height) return `${level.height}p`;
        if (level.attrs && level.attrs.RESOLUTION) {
            const resolution = String(level.attrs.RESOLUTION).split('x');
            if (resolution.length === 2) return `${resolution[1]}p`;
        }
        if (level.bitrate) return `${Math.round(level.bitrate / 1000)} kbps`;
        return 'Unknown';
    }

    function updateQualityDisplay(currentLevelIndex = null) {
        if (isAutoQuality) {
            if (currentLevelIndex !== null && hls && hls.levels[currentLevelIndex]) {
                const autoLabel = getQualityLabel(hls.levels[currentLevelIndex]);
                qualitySummary.textContent = `Auto (${autoLabel})`;
            } else {
                qualitySummary.textContent = 'Auto';
            }
            qualityValueLabel.textContent = 'Auto';
            return;
        }

        const manualLabel = selectedManualLevel !== null && hls && hls.levels[selectedManualLevel]
            ? getQualityLabel(hls.levels[selectedManualLevel])
            : 'Auto';
        qualitySummary.textContent = manualLabel;
        qualityValueLabel.textContent = manualLabel;
    }

    function refreshQualityActiveState() {
        const allQualityButtons = qualityOptionsContainer.querySelectorAll('.settings-option[data-quality]');
        allQualityButtons.forEach(button => {
            if (button.dataset.quality === 'auto') {
                button.classList.toggle('active', isAutoQuality);
            } else {
                const buttonLevel = Number(button.dataset.level);
                button.classList.toggle('active', !isAutoQuality && buttonLevel === selectedManualLevel);
            }
        });
    }

    function setQualityAvailability(isAvailable) {
        openQualityMenuBtn.classList.toggle('disabled', !isAvailable);
        openQualityMenuBtn.setAttribute('aria-disabled', String(!isAvailable));
        if (!isAvailable) {
            qualitySummary.textContent = 'N/A';
            qualityValueLabel.textContent = 'Không hỗ trợ';
        }
    }

    function applyQualitySelection(levelIndex) {
        if (!hls) return;

        if (levelIndex === -1) {
            isAutoQuality = true;
            selectedManualLevel = null;
            hls.currentLevel = -1;
            hls.nextLevel = -1;
        } else {
            isAutoQuality = false;
            selectedManualLevel = levelIndex;
            hls.currentLevel = levelIndex;
            hls.nextLevel = levelIndex;
        }

        updateQualityDisplay();
        refreshQualityActiveState();
    }

    function renderQualityOptionsFromHls() {
        if (!hls || !hls.levels || hls.levels.length === 0) {
            setQualityAvailability(false);
            return;
        }

        const dedupByHeight = new Map();
        hls.levels.forEach((level, index) => {
            const height = level.height || 0;
            const current = dedupByHeight.get(height);
            if (!current || (level.bitrate || 0) > (current.bitrate || 0)) {
                dedupByHeight.set(height, {
                    index,
                    bitrate: level.bitrate || 0,
                    label: getQualityLabel(level),
                    height
                });
            }
        });

        const qualityLevels = Array.from(dedupByHeight.values())
            .sort((a, b) => b.height - a.height);

        const html = [
            '<button class="settings-option active" data-quality="auto" data-level="-1" type="button">Auto</button>',
            ...qualityLevels.map(item => (
                `<button class="settings-option" data-quality="manual" data-level="${item.index}" type="button">${item.label}</button>`
            ))
        ].join('');

        qualityOptionsContainer.innerHTML = html;
        setQualityAvailability(true);

        qualityOptionsContainer.querySelectorAll('.settings-option[data-quality]').forEach(button => {
            button.addEventListener('click', () => {
                const levelIndex = Number(button.dataset.level);
                applyQualitySelection(levelIndex);
                closeSettingsMenu();
            });
        });

        refreshQualityActiveState();
        updateQualityDisplay();
    }

    // --- Time format ---
    function formatTime(seconds) {
        let m = Math.floor(seconds / 60);
        let s = Math.floor(seconds % 60);
        return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }

    function applyResumePosition(force = false) {
        if (hasAppliedResume || resumeStartSeconds <= 0) {
            return;
        }

        const hasDuration = Number.isFinite(video.duration) && video.duration > 0;
        if (!hasDuration && !force) {
            return;
        }

        const target = hasDuration
            ? Math.min(resumeStartSeconds, Math.max(video.duration - 1, 0))
            : resumeStartSeconds;

        if (target > 0) {
            video.currentTime = target;
            currentTimeDisplay.textContent = formatTime(target);
        }

        hasAppliedResume = true;
    }

    video.addEventListener('loadedmetadata', () => {
        durationDisplay.textContent = formatTime(video.duration);
        applyResumePosition(true);
        syncWatchProgress();
    });

    video.addEventListener('durationchange', () => applyResumePosition());
    video.addEventListener('canplay', () => applyResumePosition(true));

    // --- Update progress (giảm lag UI) ---
    let lastUpdate = 0;
    video.addEventListener('timeupdate', () => {
        const now = Date.now();
        if (now - lastUpdate < 200) return;
        lastUpdate = now;

        const percent = (video.currentTime / video.duration) * 100;
        currentProgress.style.width = percent + '%';
        currentTimeDisplay.textContent = formatTime(video.currentTime);

        if (now - lastHistorySyncAt >= HISTORY_SYNC_INTERVAL_MS) {
            syncWatchProgress();
        }
    });

    video.addEventListener('pause', () => syncWatchProgress());
    video.addEventListener('ended', () => syncWatchProgress(true));

    // --- Seek tối ưu ---
    video.addEventListener('seeking', () => {
        if (hls) {
            hls.stopLoad();
            hls.startLoad(video.currentTime); // 🔥 load ngay vị trí mới
        }
    });

    video.preload = "auto";

    // --- Click progress ---
    let seekingLock = false;

    progressBarContainer.addEventListener('click', (e) => {
        if (seekingLock) return;
        seekingLock = true;

        const rect = progressBarContainer.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        const newTime = percent * video.duration;

        // ✅ Update UI ngay
        currentProgress.style.width = (percent * 100) + '%';
        currentTimeDisplay.textContent = formatTime(newTime);

        // ✅ Set video time
        video.currentTime = newTime;

        setTimeout(() => seekingLock = false, 200);
    });

    // --- Load video ---
    async function loadVideo() {
        try {
            if (!videoContentId) {
                console.error('Thieu videoContentId de tai video');
                return;
            }

            const res = await fetch(`/api/video/watch/${videoContentId}`);
            const videoSrc = await res.text();

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,

                    maxBufferLength: 4,
                    maxMaxBufferLength: 8,
                    backBufferLength: 0,

                    maxBufferHole: 0.3,
                    startLevel: 0 // 🔥 load nhanh hơn
                });

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    isAutoQuality = true;
                    selectedManualLevel = null;
                    renderQualityOptionsFromHls();
                    updateQualityDisplay();
                    applyResumePosition(true);
                });

                hls.on(Hls.Events.LEVEL_SWITCHED, (_event, data) => {
                    updateQualityDisplay(data.level);
                    refreshQualityActiveState();
                });

                hls.loadSource(videoSrc);
                hls.attachMedia(video);

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                setQualityAvailability(false);
            }

        } catch (err) {
            console.error("Lỗi load video:", err);
        }
    }

    async function syncWatchProgress(isFinalSync = false) {
        if (!videoContentId) {
            return;
        }

        const currentTime = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        const payload = {
            videoContentId,
            currentTimeSeconds: currentTime,
            durationSeconds: duration
        };

        lastHistorySyncAt = Date.now();

        if (isFinalSync && navigator.sendBeacon) {
            const body = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            navigator.sendBeacon('/api/v1/history/progress', body);
            return;
        }

        try {
            await fetch('/api/v1/history/progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: isFinalSync
            });
        } catch (error) {
            console.warn('Khong the dong bo lich su xem', error);
        }
    }

    window.addEventListener('beforeunload', () => {
        syncWatchProgress(true);
    });

    loadVideo();
</script>

<!-- ====== JS: Tabs + Bình luận + Đánh giá + Modal ====== -->
<script>
    const _movieId = new URLSearchParams(window.location.search).get('id');
    let _selectedScore = 0;

    // ========== Tabs ==========
    function switchTab(tab) {
        const btns = document.querySelectorAll('.tab-btn');
        btns[0].classList.toggle('active', tab === 'comment');
        btns[1].classList.toggle('active', tab === 'rating');

        document.getElementById('tabComment').classList.toggle('active', tab === 'comment');
        document.getElementById('tabRating').classList.toggle('active', tab === 'rating');

        const title = document.getElementById('tabTitle');
        if (tab === 'comment') {
            title.innerHTML = 'Bình luận (<span id="commentCount">' + (document.getElementById('commentCount')?.innerText || '0') + '</span>)';
        } else {
            title.innerHTML = 'Đánh giá (<span id="ratingTabCount">0</span>)';
            loadRatings();
        }
    }

    // ========== Cuộn xuống bình luận ==========
    function scrollToCommentZone() {
        const zone = document.getElementById('commentZone');
        if (zone) {
            zone.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setTimeout(() => document.getElementById('commentInput').focus(), 400);
        }
    }

    // ========== Fetch thông tin phim ==========
    document.addEventListener('DOMContentLoaded', function () {
        if (_movieId) {
            fetch('/api/movies/' + _movieId)
                .then(res => res.ok ? res.json() : Promise.reject(res.status))
                .then(data => {
                    document.getElementById('m-title').innerText = data.title || 'Không có tên';
                    document.getElementById('m-rating').innerText = data.rating ? data.rating.toFixed(1) : '0';
                })
                .catch(() => {
                    document.getElementById('m-title').innerText = 'Không tải được thông tin phim';
                });

            loadComments();
        }
    });

    // ========== Đếm ký tự ==========
    const commentInput = document.getElementById('commentInput');
    const charCount = document.getElementById('charCount');
    commentInput.addEventListener('input', () => {
        charCount.innerText = commentInput.value.length;
    });

    // ========== Load bình luận ==========
    async function loadComments() {
        if (!_movieId) return;
        try {
            const res = await fetch('/api/v1/comments?videoContentId=' + _movieId);
            const data = await res.json();
            const container = document.getElementById('commentList');
            const countEl = document.getElementById('commentCount');
            if (countEl) countEl.innerText = data.length;

            if (data.length === 0) {
                container.innerHTML = '<p class="no-data-msg">Chưa có bình luận nào. Hãy là người đầu tiên!</p>';
                return;
            }

            container.innerHTML = data.map(c => {
                const repliesHtml = (c.replies && c.replies.length > 0)
                    ? '<div class="reply-list">' + c.replies.map(r => `
                        <div class="reply-item">
                            <div class="reply-avatar">${(r.userName || 'A').charAt(0).toUpperCase()}</div>
                            <div class="reply-body">
                                <div class="reply-user-name">${escHtml(r.userName)}</div>
                                <div class="reply-text">${escHtml(r.content)}</div>
                                <div class="reply-date">${formatDate(r.createdAt)}</div>
                            </div>
                        </div>
                    `).join('') + '</div>'
                    : '';

                return `
                <div class="comment-item">
                    <div class="comment-avatar">${(c.userName || 'A').charAt(0).toUpperCase()}</div>
                    <div class="comment-body">
                        <div class="comment-user-name">${escHtml(c.userName)}</div>
                        <div class="comment-text">${escHtml(c.content)}</div>
                        <div class="comment-actions">
                            <span class="comment-date">${formatDate(c.createdAt)}</span>
                            <button class="reply-btn" onclick="toggleReplyBox('${c.id}')">
                                <i class="fa-solid fa-reply"></i> Trả lời
                            </button>
                        </div>
                        <div class="reply-box" id="replyBox-${c.id}">
                            <textarea id="replyInput-${c.id}" placeholder="Viết phản hồi..." maxlength="500"></textarea>
                            <div class="reply-box-footer">
                                <button class="btn-cancel-reply" onclick="toggleReplyBox('${c.id}')">Hủy</button>
                                <button class="btn-send-reply" onclick="sendReply('${c.id}')">Gửi</button>
                            </div>
                        </div>
                        ${repliesHtml}
                    </div>
                </div>
                `;
            }).join('');
        } catch (e) {
            console.error('Lỗi load bình luận:', e);
        }
    }

    // ========== Gửi bình luận ==========
    async function sendComment() {
        const content = commentInput.value.trim();
        const errorEl = document.getElementById('commentError');
        const successEl = document.getElementById('commentSuccess');
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        if (!content) {
            errorEl.innerText = 'Bình luận không được để trống';
            errorEl.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/v1/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content, videoContentId: _movieId })
            });

            if (res.ok) {
                successEl.innerText = 'Gửi bình luận thành công!';
                successEl.style.display = 'block';
                commentInput.value = '';
                charCount.innerText = '0';
                loadComments();
            } else {
                const msg = await res.text();
                errorEl.innerText = msg || 'Gửi thất bại. Vui lòng đăng nhập.';
                errorEl.style.display = 'block';
            }
        } catch (err) {
            errorEl.innerText = 'Lỗi kết nối, vui lòng thử lại.';
            errorEl.style.display = 'block';
        }
    }

    // ========== Load đánh giá ==========
    async function loadRatings() {
        if (!_movieId) return;
        try {
            const res = await fetch('/api/v1/ratings?videoContentId=' + _movieId);
            const data = await res.json();
            const container = document.getElementById('ratingList');
            const tabCount = document.getElementById('ratingTabCount');
            if (tabCount) tabCount.innerText = data.totalCount || 0;

            // Cập nhật rating badge trên thanh phim
            document.getElementById('m-rating').innerText = data.averageScore ? data.averageScore.toFixed(1) : '0';

            if (!data.ratings || data.ratings.length === 0) {
                container.innerHTML = '<p class="no-data-msg">Chưa có đánh giá nào.</p>';
                return;
            }

            container.innerHTML = data.ratings.map(r => `
                <div class="rating-item">
                    <div class="comment-avatar">${(r.userName || 'A').charAt(0).toUpperCase()}</div>
                    <div class="comment-body">
                        <div class="comment-user-name">${escHtml(r.userName)}</div>
                        <div class="rating-stars-display">${'★'.repeat(r.score)}${'☆'.repeat(5 - r.score)}</div>
                        ${r.review ? '<div class="review-text">' + escHtml(r.review) + '</div>' : ''}
                        <div class="comment-date">${formatDate(r.createdAt)}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error('Lỗi load đánh giá:', e);
        }
    }

    // ========== Modal Đánh giá ==========
    document.getElementById('btnRating').addEventListener('click', openRatingModal);

    function openRatingModal() {
        const title = document.getElementById('m-title').innerText;
        document.getElementById('ratingModalTitle').innerText = title;
        document.getElementById('ratingModalMsg').innerText = '';
        document.getElementById('reviewInput').value = '';

        // Lấy avg + count
        fetch('/api/v1/ratings?videoContentId=' + _movieId)
            .then(r => r.json())
            .then(data => {
                document.getElementById('ratingModalAvg').innerText = data.averageScore ? data.averageScore.toFixed(1) : '0';
                document.getElementById('ratingModalCount').innerText = data.totalCount || 0;
            }).catch(() => {});

        _selectedScore = 0;
        document.querySelectorAll('.star-picker-item').forEach(el => el.classList.remove('selected'));
        document.getElementById('ratingModalOverlay').classList.add('show');
    }

    function closeRatingModal() {
        document.getElementById('ratingModalOverlay').classList.remove('show');
    }

    function pickStar(score) {
        _selectedScore = score;
        document.querySelectorAll('.star-picker-item').forEach(el => {
            const s = Number(el.dataset.score);
            el.classList.toggle('selected', s <= score);
        });
    }

    async function submitRating() {
        const msgEl = document.getElementById('ratingModalMsg');
        if (_selectedScore < 1) {
            msgEl.style.color = '#ff4444';
            msgEl.innerText = 'Vui lòng chọn số sao!';
            return;
        }

        try {
            const reviewText = document.getElementById('reviewInput').value.trim();
            const res = await fetch('/api/v1/ratings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ videoContentId: _movieId, score: _selectedScore, review: reviewText || null })
            });

            if (res.ok) {
                const msg = await res.text();
                msgEl.style.color = '#4caf50';
                msgEl.innerText = msg || 'Đánh giá thành công!';
                setTimeout(() => {
                    closeRatingModal();
                    loadRatings();
                }, 1000);
            } else {
                const msg = await res.text();
                msgEl.style.color = '#ff4444';
                msgEl.innerText = msg || 'Đánh giá thất bại. Vui lòng đăng nhập.';
            }
        } catch (err) {
            msgEl.style.color = '#ff4444';
            msgEl.innerText = 'Lỗi kết nối.';
        }
    }
    // ========== Phản hồi bình luận ==========
    function toggleReplyBox(commentId) {
        const box = document.getElementById('replyBox-' + commentId);
        if (box) box.classList.toggle('show');
    }

    async function sendReply(parentCommentId) {
        const input = document.getElementById('replyInput-' + parentCommentId);
        const content = input.value.trim();
        if (!content) return;

        try {
            const res = await fetch('/api/v1/comments/' + parentCommentId + '/replies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, videoContentId: _movieId })
            });

            if (res.ok) {
                input.value = '';
                toggleReplyBox(parentCommentId);
                loadComments(); // Reload để hiện phản hồi mới
            } else {
                const msg = await res.text();
                alert(msg || 'Gửi phản hồi thất bại. Vui lòng đăng nhập và có gói dịch vụ.');
            }
        } catch (err) {
            alert('Lỗi kết nối, vui lòng thử lại.');
        }
    }

    // ========== Utils ==========
    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(isoStr) {
        if (!isoStr) return '';
        try {
            const d = new Date(isoStr);
            return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'});
        } catch { return isoStr; }
    }
</script>
</body>
</html>
