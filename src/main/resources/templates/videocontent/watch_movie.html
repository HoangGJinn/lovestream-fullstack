<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix Player - Chi tiết Điều khiển</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

        <link rel="stylesheet" href="/css/videocontent/watch_movie.css">
</head>
<body>

<div class="video-player" id="player">
    <button class="back-to-origin-btn" id="backToOriginBtn" type="button" aria-label="Quay lại">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Quay lại</span>
    </button>
    <video id="video"></video>
    <div id="loadingSpinner" class="spinner hidden"></div>
    <button class="remote-play-unlock hidden" id="remotePlayUnlockBtn" type="button">
        Nhan de tiep tuc phat
    </button>
    <div class="controls-overlay" id="controlsOverlay">

        <div class="progress-bar-container" id="progressBarContainer">
            <div class="time-display">
                <span id="currentTime">00:00</span>
                <span id="duration">--:--</span>
            </div>
            <div class="current-progress" id="currentProgress"></div>
        </div>

        <div class="controls-row">

            <div class="control-group central-controls">
                <button class="control-btn" id="rewindBtn"><i class="fas fa-undo-alt"></i></button>
                <button class="control-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="forwardBtn"><i class="fas fa-redo-alt"></i></button>
                <div class="volume-container">
                    <button class="control-btn" id="muteBtn"><i class="fas fa-volume-up"></i></button>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
                </div>
            </div>

            <div class="control-group right-controls">
                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                <div class="settings-control" id="settingsControl">
                    <button class="control-btn" id="settingsBtn" title="Tốc độ phát">
                        <i class="fas fa-cog"></i>
                    </button>
                    <span class="setting-summary" id="speedSummary">1x</span>
                    <span class="setting-summary" id="qualitySummary">Auto</span>
                    <div class="settings-menu" id="settingsMenu">
                        <div class="settings-panel active" id="settingsMenuRoot">
                            <button class="settings-entry" id="openSpeedMenuBtn" type="button">
                                <span class="settings-entry-label">Tốc độ phát</span>
                                <span class="settings-entry-value" id="speedValueLabel">1x</span>
                            </button>
                            <button class="settings-entry" id="openQualityMenuBtn" type="button">
                                <span class="settings-entry-label">Chất lượng</span>
                                <span class="settings-entry-value" id="qualityValueLabel">Auto</span>
                            </button>
                        </div>

                        <div class="settings-panel" id="settingsSpeedMenu">
                            <button class="settings-entry settings-back" id="backFromSpeedBtn" type="button">← Quay lại</button>
                            <p class="settings-subtitle">Tốc độ phát</p>
                            <button class="settings-option" data-speed="0.5" type="button">0.5x</button>
                            <button class="settings-option" data-speed="0.75" type="button">0.75x</button>
                            <button class="settings-option active" data-speed="1" type="button">1x (Mặc định)</button>
                            <button class="settings-option" data-speed="1.25" type="button">1.25x</button>
                            <button class="settings-option" data-speed="1.5" type="button">1.5x</button>
                            <button class="settings-option" data-speed="2" type="button">2x</button>
                        </div>

                        <div class="settings-panel" id="settingsQualityMenu">
                            <button class="settings-entry settings-back" id="backFromQualityBtn" type="button">← Quay lại</button>
                            <p class="settings-subtitle">Chất lượng phát</p>
                            <div id="qualityOptions">
                                <button class="settings-option active" data-quality="auto" type="button">Auto</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="control-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
            </div>
        </div>

    </div>
</div>
<!-- ====== THANH THÔNG TIN PHIM ====== -->
<div class="movie-compact-bar">
    <div class="compact-left">
        <h1 class="c-title" id="m-title">Đang tải phim...</h1>
        <div class="room-meta" id="roomMeta">
            <span>Room <strong id="roomCodeLabel">-</strong></span>
            <span>|</span>
            <span><i class="fa-solid fa-users"></i> <strong id="participantCount">0</strong></span>
            <span>|</span>
            <span id="roomRoleLabel">Viewer</span>
        </div>
    </div>
    <div class="compact-right">
        <div class="action-buttons-group">
            <div class="action-item" id="btnRating">
                <i class="fa-solid fa-star"></i>
                <span>Đánh giá</span>
            </div>
            <div class="action-item" id="btnComment" onclick="scrollToCommentZone()">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Bình luận</span>
            </div>
            <div class="rating-badge-blue">
                <i class="fa-solid fa-star"></i>
                <span id="m-rating" style="margin: 0 5px;">0</span>
                <small>Đánh giá</small>
            </div>
        </div>
    </div>
</div>

<!-- ====== KHU VỰC BÌNH LUẬN + ĐÁNH GIÁ (TABS) ====== -->
<div class="comment-zone" id="commentZone">
    <h2>
        <i class="fa-solid fa-comment-dots"></i>
        <span id="tabTitle">Bình luận (<span id="commentCount">0</span>)</span>
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('comment')">Bình luận</button>
            <button class="tab-btn" onclick="switchTab('rating')">Đánh giá</button>
        </div>
    </h2>

    <!-- TAB BÌNH LUẬN -->
    <div class="tab-content active" id="tabComment">

        <div class="comment-input-area">
            <textarea id="commentInput" placeholder="Viết bình luận" maxlength="500"></textarea>
            <div class="comment-input-footer">
                <span class="char-counter"><span id="charCount">0</span> / 500</span>
                <button class="btn-send-comment" onclick="sendComment()">
                    Gửi <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <div class="comment-error" id="commentError"></div>
        <div class="comment-success" id="commentSuccess"></div>
        <div class="comment-list" id="commentList">
            <p class="no-data-msg">Đang tải bình luận...</p>
        </div>
    </div>

    <!-- TAB ĐÁNH GIÁ -->
    <div class="tab-content" id="tabRating">
        <div id="ratingList">
            <p class="no-data-msg">Đang tải đánh giá...</p>
        </div>
    </div>
</div>

<!-- ====== MODAL ĐÁNH GIÁ SAO ====== -->
<div class="rating-modal-overlay" id="ratingModalOverlay">
    <div class="rating-modal">
        <button class="rating-modal-close" onclick="closeRatingModal()">&times;</button>
        <h3 id="ratingModalTitle">Đánh giá phim</h3>
        <div class="rating-modal-avg">
            <i class="fa-solid fa-star"></i>
            <span id="ratingModalAvg">0</span> / <span id="ratingModalCount">0</span> lượt đánh giá
        </div>
        <div class="star-picker" id="starPicker">
            <div class="star-picker-item" data-score="1" onclick="pickStar(1)">
                <i class="fa-solid fa-star star-icon"></i>
                <span class="star-label">Dở tệ</span>
            </div>
            <div class="star-picker-item" data-score="2" onclick="pickStar(2)">
                <i class="fa-solid fa-star star-icon"></i>
                <span class="star-label">Phim chán</span>
            </div>
            <div class="star-picker-item" data-score="3" onclick="pickStar(3)">
                <i class="fa-solid fa-star star-icon"></i>
                <span class="star-label">Khá ổn</span>
            </div>
            <div class="star-picker-item" data-score="4" onclick="pickStar(4)">
                <i class="fa-solid fa-star star-icon"></i>
                <span class="star-label">Phim hay</span>
            </div>
            <div class="star-picker-item" data-score="5" onclick="pickStar(5)">
                <i class="fa-solid fa-star star-icon"></i>
                <span class="star-label">Tuyệt vời</span>
            </div>
        </div>
        <textarea class="review-textarea" id="reviewInput" placeholder="Viết nhận xét về phim (tuỳ chọn)" maxlength="500"></textarea>
        <div class="rating-modal-btns">
            <button class="btn-submit-rating" onclick="submitRating()">Gửi đánh giá</button>
            <button class="btn-close-rating" onclick="closeRatingModal()">Đóng</button>
        </div>
        <div class="rating-modal-msg" id="ratingModalMsg"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    // Lưu email người dùng hiện tại vào biến toàn cục window
    window.currentUserEmail = /*[[${currentUserEmail}]]*/ '';

    window.watchMovieConfig = {
        videoId: /*[[${videoId}]]*/ '',
        roomState: /*[[${roomState}]]*/ null,
        maxAllowedHeight: /*[[${maxAllowedHeight}]]*/ 480,
        planQualityLabel: /*[[${planQualityLabel}]]*/ 'SD (480p)',
        upgradePackagesUrl: '/packages'
    };
</script>
<script src="/js/videocontent/watch_movie.js"></script>
</body>
</html>
