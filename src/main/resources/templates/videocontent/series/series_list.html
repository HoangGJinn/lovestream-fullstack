<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveStream - Danh sach series</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .series-list-page {
            padding-top: 90px;
            min-height: 100vh;
        }

        .series-list-header {
            padding: 0 4% 16px;
        }

        .series-list-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .series-list-subtitle {
            margin: 6px 0 0;
            color: #b3b3b3;
            font-size: 0.95rem;
        }

        .series-list-page .main-content {
            margin-top: 0;
            padding-bottom: 40px;
        }

        .empty-series {
            margin: 16px 4% 0;
            color: #b3b3b3;
            font-size: 1rem;
        }

        .series-filter-form {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .series-filter-label {
            color: #e5e5e5;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .series-filter-input {
            background-color: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 12px;
            min-width: 260px;
        }

        .series-filter-btn {
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .series-filter-btn:hover {
            background: #f6121d;
        }
    </style>
</head>
<body>

<div class="navbar" id="navbar">
            <div th:replace="~{fragments/top-navbar :: topNavLeft('series')}"></div>
        <div class="nav-right">
        <div th:replace="~{fragments/top-navbar :: topNavSearch(
            'seriesSearchForm',
            'seriesSearchToggle',
            'seriesSearchInput',
            @{/series},
            'Tìm series...',
            ${currentKeyword},
            false,
            null,
            null
        )}"></div>
        <a href="/notifications" class="nav-icon notification-link" aria-label="Thong bao">
            <i class="fa-regular fa-bell"></i>
            <span th:if="${unreadCount > 0}" class="notification-badge" th:text="${unreadCount > 99 ? '99+' : unreadCount}">0</span>
        </a>
        <div th:replace="~{fragments/user-menu :: userMenu(${currentUser}, 'dark')}"></div>
    </div>
</div>

<div class="series-list-page">
    <header class="series-list-header">
        <h1 class="series-list-title">Danh sach series</h1>
        <p class="series-list-subtitle">Chi hien thi cac phim tap voi giao dien giong trang phim.</p>

        <form class="series-filter-form" method="get" action="/series">
            <label class="series-filter-label" for="keyword">Tìm kiếm</label>
            <input id="keyword" name="keyword" class="series-filter-input" type="text"
                   placeholder="Tìm theo tên series..." th:value="${currentKeyword}">
            <button class="series-filter-btn" type="submit">Áp dụng</button>
        </form>
    </header>

    <div class="main-content">
        <div class="categories-container" th:if="${#lists.isEmpty(seriesRows)}">
            <p class="empty-series">Chua co series de hien thi.</p>
        </div>

        <div class="categories-container" th:each="row : ${seriesRows}">
            <div class="row-posters">
                <a th:each="series : ${row}" th:href="@{/series/{id}(id=${series.id}, keyword=${currentKeyword})}"
                   style="text-decoration:none;color:inherit;">
                    <div class="movie-card" th:id="${series.id}">
                        <img th:src="${series.posterUrl}" class="row-poster" th:alt="${series.title}">
                        <div class="movie-title-overlay" th:text="${series.title}"></div>
                    </div>
                </a>

            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });

    (function () {
        const form = document.getElementById('seriesSearchForm');
        const toggle = document.getElementById('seriesSearchToggle');
        const input = document.getElementById('seriesSearchInput');

        if (!form || !toggle || !input) return;

        function submitSearch() {
            const term = (input.value || '').trim();
            if (!term) return;
            input.value = term;
            form.submit();
        }

        toggle.addEventListener('click', function () {
            if (!form.classList.contains('is-open')) {
                form.classList.add('is-open');
                input.focus();
                return;
            }
            submitSearch();
        });

        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitSearch();
            }
        });
    })();
</script>

</body>
</html>
