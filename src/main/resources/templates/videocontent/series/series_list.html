<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveStream - Danh sach series</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .series-list-page {
            padding-top: 90px;
            min-height: 100vh;
        }

        .series-list-header {
            padding: 0 4% 16px;
        }

        .series-list-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .series-list-subtitle {
            margin: 6px 0 0;
            color: #b3b3b3;
            font-size: 0.95rem;
        }

        .series-list-page .main-content {
            margin-top: 0;
            padding-bottom: 40px;
        }

        .empty-series {
            margin: 16px 4% 0;
            color: #b3b3b3;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="navbar" id="navbar">
    <div class="nav-left">
        <a href="/" class="logo">LoveStream</a>
        <ul class="nav-links">
            <li><a href="/home">Trang chu</a></li>
            <li><a href="/series" class="active">Series</a></li>
            <li><a href="/movies">Phim</a></li>
            <li><a href="#">Moi & Pho bien</a></li>
            <li><a href="#">Danh sach cua toi</a></li>
        </ul>
    </div>
    <div class="nav-right">
        <i class="fa-solid fa-magnifying-glass nav-icon"></i>
        <a href="/notifications" class="nav-icon" aria-label="Thong bao"><i class="fa-regular fa-bell"></i></a>
        <div th:replace="~{fragments/user-menu :: userMenu(${currentUser}, 'dark')}"></div>
    </div>
</div>

<div class="series-list-page">
    <header class="series-list-header">
        <h1 class="series-list-title">Danh sach series</h1>
        <p class="series-list-subtitle">Chi hien thi cac phim tap voi giao dien giong trang phim.</p>
    </header>

    <div class="main-content">
        <div class="categories-container" th:if="${#lists.isEmpty(seriesRows)}">
            <p class="empty-series">Chua co series de hien thi.</p>
        </div>

        <div class="categories-container" th:each="row : ${seriesRows}">
            <div class="row-posters">
                <a th:each="series : ${row}" th:href="@{/series/{id}(id=${series.id})}"
                   style="text-decoration:none;color:inherit;">
                    <div class="movie-card" th:id="${series.id}">
                        <img th:src="${series.posterUrl}" class="row-poster" th:alt="${series.title}">
                        <div class="movie-title-overlay" th:text="${series.title}"></div>
                    </div>
                </a>

            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });
</script>

</body>
</html>
