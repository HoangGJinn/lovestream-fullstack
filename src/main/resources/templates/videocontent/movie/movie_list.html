<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách phim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .movie-list-page {
            padding-top: 90px;
            min-height: 100vh;
        }

        .movie-list-header {
            padding: 0 4% 16px;
        }

        .movie-list-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .movie-list-subtitle {
            margin: 6px 0 0;
            color: #b3b3b3;
            font-size: 0.95rem;
        }

        .movie-filter-form {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .movie-filter-label {
            color: #e5e5e5;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .movie-filter-select {
            background-color: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 12px;
            min-width: 260px;
        }

        /* Giữ keyword nhưng không hiển thị input search cố định trong filter bar */
        .movie-filter-hidden {
            display: none;
        }

        .movie-filter-btn {
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .movie-filter-btn:hover {
            background: #f6121d;
        }

        .movie-list-page .main-content {
            margin-top: 0;
            padding-bottom: 40px;
        }

        .empty-movies {
            margin: 16px 4% 0;
            color: #b3b3b3;
            font-size: 1rem;
        }
        .error-movies {
            margin: 16px 4% 0;
            color: #ff6b6b;
            font-size: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="navbar" id="navbar">
            <div th:replace="~{fragments/top-navbar :: topNavLeft('movies')}"></div>
        <div class="nav-right">
        <div th:replace="~{fragments/top-navbar :: topNavSearch(
            'movieSearchForm',
            'movieSearchToggle',
            'movieSearchInput',
            @{/movies},
            'Tìm phim...',
            ${currentKeyword},
            false,
            'sort',
            ${selectedSort}
        )}"></div>
        <a href="/notifications" class="nav-icon notification-link" aria-label="Thong bao">
            <i class="fa-regular fa-bell"></i>
            <span th:if="${unreadCount > 0}" class="notification-badge" th:text="${unreadCount > 99 ? '99+' : unreadCount}">0</span>
        </a>
        <div th:replace="~{fragments/user-menu :: userMenu(${currentUser}, 'dark')}"></div>
    </div>
</div>

<div class="movie-list-page">
    <header class="movie-list-header">
        <h1 class="movie-list-title">Danh sách phim</h1>
        <p class="movie-list-subtitle">Khám phá bộ sưu tập phim theo phong cách trang chủ.</p>

        <form class="movie-filter-form" method="get" action="/movies">
            <label class="movie-filter-label" for="sort">Sắp xếp theo</label>
            <select id="sort" name="sort" class="movie-filter-select" style="min-width: auto;">
                <option value="default" th:selected="${selectedSort == 'default'}">Mặc định (Đề xuất cho bạn)</option>
                <option value="recommended" th:selected="${selectedSort == 'recommended'}">Đề xuất cho bạn (Recommended for You)</option>
                <option value="popularity" th:selected="${selectedSort == 'popularity'}">Phổ biến (Popularity / Trending)</option>
                <option value="newest" th:selected="${selectedSort == 'newest'}">Mới nhất (Release Date)</option>
                <option value="top_rated" th:selected="${selectedSort == 'top_rated'}">Đánh giá cao (Top Rated)</option>
                <option value="az" th:selected="${selectedSort == 'az'}">A → Z</option>
                <option value="za" th:selected="${selectedSort == 'za'}">Z → A</option>
                <option value="duration_asc" th:selected="${selectedSort == 'duration_asc'}">Thời lượng: ngắn → dài</option>
                <option value="duration_desc" th:selected="${selectedSort == 'duration_desc'}">Thời lượng: dài → ngắn</option>
            </select>

            <label class="movie-filter-label" for="age" style="margin-left: 16px;">Độ tuổi người xem</label>
            <select id="age" name="age" class="movie-filter-select" style="min-width: auto;">
                <option value="" th:selected="${selectedAge == null}">Tất cả (Không lọc)</option>
                <option value="10" th:selected="${selectedAge == 10}">Trẻ em (&lt; 13 tuổi)</option>
                <option value="14" th:selected="${selectedAge == 14}">Thiếu niên (13 - 15 tuổi)</option>
                <option value="16" th:selected="${selectedAge == 16}">Thanh thiếu niên (16 - 17 tuổi)</option>
                <option value="18" th:selected="${selectedAge == 18}">Người lớn (&gt;= 18 tuổi)</option>
            </select>

            <input id="keyword" name="keyword" class="movie-filter-hidden" type="hidden" th:value="${currentKeyword}">
            <button class="movie-filter-btn" type="submit">Áp dụng</button>
        </form>
    </header>

    <div class="main-content">
        <div class="categories-container" th:if="${#lists.isEmpty(movieRows)}">
            <p class="empty-movies">Chưa có phim để hiển thị.</p>
        </div>
        <div class="categories-container" th:if="${errorMessage != null}">
            <p class="error-movies" th:text="${errorMessage}">Không thể kết nối hệ thống. Vui lòng thử lại sau.</p>
        </div>

        <div class="categories-container" th:if="${#lists.isEmpty(movieRows) and errorMessage == null}">
            <p class="empty-movies" th:text="${emptyMessage != null ? emptyMessage : 'Hiện chưa có phim nào'}">Hiện chưa có phim nào</p>
        </div>

        <div class="categories-container" th:each="row, rowStat : ${movieRows}">
<!--            <h2 class="row-title" th:text="|Danh sách phim ${rowStat.count}|"></h2>-->
            <div class="row-posters">
                <a class="movie-card" th:id="${movie.id}" th:each="movie : ${row}"
                   th:href="@{/movies/{id}(id=${movie.id}, sort=${selectedSort}, keyword=${currentKeyword})}">
                    <img th:src="${movie.imagePosterUrl}" class="row-poster" th:alt="${movie.title}">
                    <div class="movie-title-overlay" th:text="${movie.title}"></div>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });

    (function () {
        const form = document.getElementById('movieSearchForm');
        const toggle = document.getElementById('movieSearchToggle');
        const input = document.getElementById('movieSearchInput');

        if (!form || !toggle || !input) return;

        function submitSearch() {
            const term = (input.value || '').trim();
            if (!term) return;
            input.value = term;
            form.submit();
        }

        toggle.addEventListener('click', function () {
            if (!form.classList.contains('is-open')) {
                form.classList.add('is-open');
                input.focus();
                return;
            }
            submitSearch();
        });

        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitSearch();
            }
        });
    })();
</script>

</body>
</html>
