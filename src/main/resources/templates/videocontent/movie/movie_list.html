<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveStream - Danh sach phim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <style>
        .movie-list-page {
            padding-top: 90px;
            min-height: 100vh;
        }

        .movie-list-header {
            padding: 0 4% 16px;
        }

        .movie-list-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .movie-list-subtitle {
            margin: 6px 0 0;
            color: #b3b3b3;
            font-size: 0.95rem;
        }

        .movie-list-page .main-content {
            margin-top: 0;
            padding-bottom: 40px;
        }

        .empty-movies {
            margin: 16px 4% 0;
            color: #b3b3b3;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="navbar" id="navbar">
    <div class="nav-left">
        <a href="/" class="logo">LoveStream</a>
        <ul class="nav-links">
            <li><a href="/home">Trang chu</a></li>
            <li><a href="#">Series</a></li>
            <li><a href="/movies" class="active">Phim</a></li>
            <li><a href="#">Moi & Pho bien</a></li>
            <li><a href="#">Danh sach cua toi</a></li>
        </ul>
    </div>
    <div class="nav-right">
        <i class="fa-solid fa-magnifying-glass nav-icon"></i>
        <i class="fa-regular fa-bell nav-icon"></i>
        <div th:replace="~{fragments/user-menu :: userMenu(${currentUser}, 'dark')}"></div>
    </div>
</div>

<div class="movie-list-page">
    <header class="movie-list-header">
        <h1 class="movie-list-title">Danh sách phim</h1>
        <p class="movie-list-subtitle">Kham pha bo suu tap phim theo phong cach trang chu.</p>
    </header>

    <div class="main-content">
<!--        <div class="categories-container" th:if="${#lists.isEmpty(movieRows)}">-->
<!--            <p class="empty-movies">Chua co phim de hien thi.</p>-->
<!--        </div>-->

        <div class="categories-container" th:each="row : ${movieRows}">
<!--            <h2 class="row-title" th:text="|Danh sach phim ${rowStat.count}|"></h2>-->
            <div class="row-posters">
                <div class="movie-card" th:id="${movie.id}" th:each="movie : ${row}">
                    <img th:src="${movie.imagePosterUrl}" class="row-poster" th:alt="${movie.title}">
                    <div class="movie-title-overlay" th:text="${movie.title}"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('scroll', () => {
        const navbar = document.getElementById('navbar');
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });
</script>

</body>
</html>
