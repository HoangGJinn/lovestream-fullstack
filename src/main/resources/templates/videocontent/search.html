<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm nội dung - LoveStream</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans:wght@400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/user-menu.css">
    <link rel="stylesheet" href="/css/videocontents.css">
</head>

<body>
    <div class="navbar scrolled" id="navbar">
                <div th:replace="~{fragments/top-navbar :: topNavLeft('discover')}"></div>
        <div class="nav-right">
            <form id="searchForm" class="nav-search is-open" th:action="@{/videocontents/search}" method="get" style="position: relative;">
                <button id="searchToggle" class="nav-icon nav-search-toggle" type="button" aria-label="Tìm kiếm">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <input id="searchKeyword" class="nav-search-input" name="keyword" type="text"
                    placeholder="Tìm phim, series..." th:value="${searchRequest.keyword}" autocomplete="off">
                <input type="hidden" id="searchGenre" name="genre" th:value="${searchRequest.genre}">
                <input type="hidden" id="searchYear" name="year" th:value="${searchRequest.year}">
                <input type="hidden" id="searchCountry" name="country" th:value="${searchRequest.country}">
                <input type="hidden" id="searchType" name="type" th:value="${searchRequest.type}">
                <input type="hidden" id="searchSeason" name="season" th:value="${searchRequest.season}">
                <div class="search-suggest-box" data-role="search-suggest-box"></div>
            </form>
            <a th:if="${currentUser != null}" href="/notifications" class="nav-icon notification-link" aria-label="Thong bao">
                <i class="fa-regular fa-bell"></i>
                <span th:if="${unreadCount > 0}" class="notification-badge" th:text="${unreadCount > 99 ? '99+' : unreadCount}">0</span>
            </a>
            <div th:replace="~{fragments/user-menu :: userMenu(${currentUser}, 'dark')}"></div>
        </div>
    </div>

    <div class="search-page">
        <div class="search-summary">
            <h1 th:if="${searchRequest.keyword != null and !#strings.isEmpty(searchRequest.keyword)}"
                th:text="${'Kết quả cho: ' + searchRequest.keyword}">Kết quả cho</h1>
            <h1 th:if="${searchRequest.keyword == null or #strings.isEmpty(searchRequest.keyword)}">Khám phá phim và
                series</h1>
            <p th:text="${searchResponse.totalResults + ' kết quả được tìm thấy'}">0 kết quả được tìm thấy</p>
            <div class="search-recent" id="recentSearches"></div>
        </div>

        <form id="filterForm" class="search-filter-bar" th:action="@{/videocontents/search}" method="get">
            <input type="hidden" name="keyword" th:value="${searchRequest.keyword}">
            <label>
                Thể loại
                <select name="genre">
                    <option value=""
                        th:selected="${searchRequest.genre == null or #strings.isEmpty(searchRequest.genre)}">Tất cả
                    </option>
                    <option th:each="g : ${genres}" th:value="${g.name}" th:text="${g.name}"
                        th:selected="${searchRequest.genre == g.name}">
                        Genre
                    </option>
                </select>
            </label>
            <label>
                Năm
                <input type="number" name="year" min="1900" max="2100" th:value="${searchRequest.year}">
            </label>
            <label>
                Quốc gia
                <input type="text" name="country" th:value="${searchRequest.country}" placeholder="Korea, US...">
            </label>
            <label>
                Loại
                <select name="type">
                    <option value=""
                        th:selected="${searchRequest.type == null or #strings.isEmpty(searchRequest.type)}">Tất cả
                    </option>
                    <option value="movie" th:selected="${searchRequest.type == 'movie'}">Phim lẻ</option>
                    <option value="series" th:selected="${searchRequest.type == 'series'}">Phim bộ</option>
                </select>
            </label>
            <label>
                Season
                <input type="number" name="season" min="1" th:value="${searchRequest.season}">
            </label>
            <button type="submit" class="search-filter-btn">Lọc</button>
        </form>

        <div class="main-content search-main-content">
            <div class="categories-container" th:if="${not #lists.isEmpty(searchResponse.data)}">
                <h2 class="row-title">Danh sách nội dung</h2>
                <div class="search-results-grid">
                    <a class="movie-card" th:each="item : ${searchResponse.data}"
                       th:with="targetHref=${(item.type == 'series') ? ('/series/' + item.id) : ('/movies/' + (item.slugOrId != null ? item.slugOrId : item.id))}"
                       th:href="${targetHref}">
                        <img th:src="${item.posterUrl}" class="row-poster" th:alt="${item.title}">
                        <div class="movie-title-overlay">
                            <div class="search-card-title" th:text="${item.title}">Tên phim</div>
                            <div class="search-card-meta"
                                th:text="${item.releaseYear + ' • ' + (item.type == 'movie' ? 'Phim lẻ' : 'Phim bộ')}">
                                2026 • Phim lẻ</div>
                        </div>
                    </a>
                </div>
            </div>

            <div class="search-empty" th:if="${#lists.isEmpty(searchResponse.data)}">
                <h3>Không tìm thấy phim phù hợp</h3>
                <p>Thử từ khóa khác hoặc bỏ bớt bộ lọc để xem nhiều kết quả hơn.</p>
            </div>
        </div>
    </div>

    <script>
        // Recent searches only (autocomplete is now global via /js/search-suggest.js)
        (function () {
            const recentBox = document.getElementById('recentSearches');
            const form = document.getElementById('searchForm');
            if (!recentBox || !form) return;

            function renderRecent() {
                const key = 'lovestream_recent_searches';
                const recent = JSON.parse(localStorage.getItem(key) || '[]');
                if (!recent.length) {
                    recentBox.innerHTML = '';
                    return;
                }

                recentBox.innerHTML = '<span>Tìm gần đây:</span>' + recent.map(function (item) {
                    return '<button type="button" class="recent-chip" data-keyword="' + String(item).replace(/"/g, '&quot;') + '">' + item + '</button>';
                }).join('');
            }

            function saveRecent(term) {
                if (!term) return;
                const key = 'lovestream_recent_searches';
                const current = JSON.parse(localStorage.getItem(key) || '[]');
                const next = [term].concat(current.filter(function (s) { return s !== term; })).slice(0, 5);
                localStorage.setItem(key, JSON.stringify(next));
                renderRecent();
            }

            recentBox.addEventListener('click', function (event) {
                const target = event.target.closest('[data-keyword]');
                if (!target) return;
                const value = (target.getAttribute('data-keyword') || '').trim();
                if (!value) return;
                saveRecent(value);
                // Submit to current form action
                const input = form.querySelector('input[name="keyword"]');
                if (input) input.value = value;
                form.submit();
            });

            // also save when user submits
            form.addEventListener('submit', function () {
                const input = form.querySelector('input[name="keyword"]');
                const term = input ? (input.value || '').trim() : '';
                if (term) saveRecent(term);
            });

            renderRecent();
        })();
    </script>
</body>

</html>
