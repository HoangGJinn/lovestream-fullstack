<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="sidebar(activeMenu)" class="admin-sidebar">
    <div class="admin-logo">LoveStream Content</div>
    <div class="admin-menu">
        <a th:href="@{/content-manager/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active'">Tổng quan</a>
        <a th:href="@{/content-manager/web-content}" th:classappend="${activeMenu == 'web-content'} ? 'active'">Nội dung web</a>
        <a th:href="@{/content-manager/movies}" th:classappend="${activeMenu == 'movies'} ? 'active'">Phim lẻ</a>
        <a th:href="@{/content-manager/series}" th:classappend="${activeMenu == 'series'} ? 'active'">TV Series</a>
        <a th:href="@{/content-manager/genres}" th:classappend="${activeMenu == 'genres'} ? 'active'">Thể loại</a>

        <a href="#" onclick="handleAdminLogout(event)" style="margin-top: 50px; color: var(--netflix-red);">Đăng xuất</a>
    </div>

    <script>
        function handleAdminLogout(event) {
            event.preventDefault();
            fetch('/api/v1/auth/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = data.redirectUrl ? data.redirectUrl : '/login';
            })
            .catch(error => {
                console.error('Lỗi khi đăng xuất:', error);
                window.location.href = '/login';
            });
        }
    </script>
</div>
</body>

</html>
