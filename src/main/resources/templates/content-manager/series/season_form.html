<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${not #strings.isEmpty(seasonUpsertRequest.id)} ? 'Sửa Season' : 'Thêm Season mới'">Form Season</title>
    <link rel="stylesheet" th:href="@{/css/content-manager/content-manager-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/content-manager/movies.css}" />
</head>
<body>

<div th:replace="~{content-manager/fragments/sidebar :: sidebar(activeMenu='series')}"></div>

<div class="admin-content">
    <header class="admin-header">
        <h1 th:text="${not #strings.isEmpty(seasonUpsertRequest.id)} ? 'Cập nhật Season' : 'Thêm Season mới'">Form Season</h1>
        <div class="header-actions">
            <a th:href="@{/content-manager/series/{id}/edit(id=${series.id})}"
               class="btn btn-secondary js-guarded-navigation">
                ← Quay lại Series: <span th:text="${series.title}"></span>
            </a>
        </div>
    </header>

    <div class="admin-content">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="form-card">
            <form th:action="${not #strings.isEmpty(seasonUpsertRequest.id)}
                    ? @{/content-manager/series/seasons/{id}(id=${seasonUpsertRequest.id})}
                    : @{/content-manager/series/{seriesId}/seasons(seriesId=${series.id})}"
                  th:object="${seasonUpsertRequest}"
                  method="post"
                  class="js-dirty-form">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{tvSeriesId}" />

                <div class="form-section">
                    <div class="form-section-title">Thông tin mùa</div>
                    <div class="form-row three-col">
                        <div class="form-group">
                            <label for="seasonNumber">Số mùa <span class="required">*</span></label>
                            <input id="seasonNumber" type="number" th:field="*{seasonNumber}" class="form-control"
                                   min="1" placeholder="VD: 1"
                                   th:classappend="${#fields.hasErrors('seasonNumber')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('seasonNumber')}" th:errors="*{seasonNumber}"></span>
                        </div>
                        <div class="form-group">
                            <label for="seasonName">Tên mùa (không bắt buộc)</label>
                            <input id="seasonName" type="text" th:field="*{name}" class="form-control"
                                   placeholder="VD: Mùa đầu tiên" />
                        </div>
                        <div class="form-group">
                            <label for="seasonReleaseYear">Năm phát hành <span class="required">*</span></label>
                            <input id="seasonReleaseYear" type="number" th:field="*{releaseYear}" class="form-control"
                                   placeholder="VD: 2024"
                                   th:classappend="${#fields.hasErrors('releaseYear')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></span>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button"
                            class="btn btn-secondary js-cancel-navigation"
                            th:attr="data-cancel-url=@{/content-manager/series/{id}/edit(id=${series.id})}">
                        Hủy
                    </button>
                    <button type="submit" class="btn btn-primary"
                            th:text="${not #strings.isEmpty(seasonUpsertRequest.id)} ? 'Lưu thay đổi' : 'Tạo mùa'">Lưu</button>
                </div>
            </form>
        </div>

        <div class="form-card" th:if="${not #strings.isEmpty(seasonUpsertRequest.id)}">
            <div class="form-section-title">Danh sách tập phim (Episode)</div>

            <div th:if="${episodes == null or #lists.isEmpty(episodes)}" style="color:#b3b3b3;margin-bottom:16px;">
                Chưa có tập phim nào. Hãy thêm tập đầu tiên.
            </div>

            <table class="table" th:if="${episodes != null and !#lists.isEmpty(episodes)}">
                <thead>
                    <tr>
                        <th>Tập</th>
                        <th>Tiêu đề</th>
                        <th>Thời lượng</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ep : ${episodes}">
                        <td th:text="${ep.episodeNumber}">1</td>
                        <td th:text="${ep.title}">Tập 1</td>
                        <td th:text="${ep.durationInMinutes} + ' phút'">45 phút</td>
                        <td class="actions">
                            <a th:href="@{/content-manager/series/episodes/{id}/edit(id=${ep.id})}"
                               class="btn btn-secondary btn-sm js-guarded-navigation">Sửa</a>
                            <form th:action="@{/content-manager/series/episodes/{id}/delete(id=${ep.id})}" method="post" style="display:inline;"
                                  onsubmit="return confirm('Xóa tập phim này?')">
                                <button class="btn btn-danger btn-sm" type="submit">Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div style="margin-top:16px;">
                <a th:href="@{/content-manager/series/seasons/{id}/episodes/new(id=${seasonUpsertRequest.id})}"
                   class="btn btn-primary js-guarded-navigation">+ Thêm Episode</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/content-manager/series-form.js}"></script>

</body>
</html>
