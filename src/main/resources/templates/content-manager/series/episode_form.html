<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${not #strings.isEmpty(episodeUpsertRequest.id)} ? 'Sửa Episode' : 'Thêm Episode mới'">Form Episode</title>
    <link rel="stylesheet" th:href="@{/css/content-manager/content-manager-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/content-manager/movies.css}" />
</head>
<body>

<div th:replace="~{content-manager/fragments/sidebar :: sidebar(activeMenu='series')}"></div>

<div class="admin-content">
    <header class="admin-header">
        <h1 th:text="${not #strings.isEmpty(episodeUpsertRequest.id)} ? 'Cập nhật Episode' : 'Thêm Episode mới'">Form Episode</h1>
        <div class="header-actions">
            <a th:href="@{/content-manager/series/seasons/{id}/edit(id=${season.id})}"
               class="btn btn-secondary js-guarded-navigation">
                ← Quay lại Mùa: <span th:text="${season.name ?: 'Mùa ' + season.seasonNumber}"></span>
            </a>
        </div>
    </header>

    <div class="admin-content">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="form-card">
            <form th:action="${not #strings.isEmpty(episodeUpsertRequest.id)}
                    ? @{/content-manager/series/episodes/{id}(id=${episodeUpsertRequest.id})}
                    : @{/content-manager/series/seasons/{seasonId}/episodes(seasonId=${season.id})}"
                  th:object="${episodeUpsertRequest}"
                  method="post"
                  class="js-dirty-form">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{seasonId}" />

                <div class="form-section">
                    <div class="form-section-title">Thông tin tập phim</div>

                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="episodeNumber">Số tập <span class="required">*</span></label>
                            <input id="episodeNumber" type="number" th:field="*{episodeNumber}" class="form-control"
                                   min="1" placeholder="VD: 1"
                                   th:classappend="${#fields.hasErrors('episodeNumber')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('episodeNumber')}" th:errors="*{episodeNumber}"></span>
                        </div>
                        <div class="form-group">
                            <label for="durationInMinutes">Thời lượng (phút) <span class="required">*</span></label>
                            <input id="durationInMinutes" type="number" th:field="*{durationInMinutes}" class="form-control"
                                   min="1" placeholder="VD: 45"
                                   th:classappend="${#fields.hasErrors('durationInMinutes')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('durationInMinutes')}" th:errors="*{durationInMinutes}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="epTitle">Tiêu đề tập <span class="required">*</span></label>
                            <input id="epTitle" type="text" th:field="*{title}" class="form-control"
                                   placeholder="VD: Cuộc gặp gỡ định mệnh"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="airDate">Ngày phát sóng (tùy chọn)</label>
                            <input id="airDate" type="date" th:field="*{airDate}" class="form-control" />
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button"
                            class="btn btn-secondary js-cancel-navigation"
                            th:attr="data-cancel-url=@{/content-manager/series/seasons/{id}/edit(id=${season.id})}">
                        Hủy
                    </button>
                    <button type="submit" class="btn btn-primary"
                            th:text="${not #strings.isEmpty(episodeUpsertRequest.id)} ? 'Lưu thay đổi' : 'Tạo tập'">Lưu</button>
                </div>
            </form>
        </div>

        <div class="form-card" th:if="${not #strings.isEmpty(episodeUpsertRequest.id)}">
            <form th:action="@{/content-manager/series/episodes/{id}/video/url(id=${episodeUpsertRequest.id})}"
                  method="post"
                  class="upload-section js-dirty-form">
                <div class="form-section-title">Video tập phim (Cloudinary URL)</div>
                <p style="margin:0 0 15px 0;color:#b3b3b3;font-size:14px;">
                    Nhập đường dẫn <code>Secure URL</code> từ Cloudinary để gắn video cho tập này.
                </p>
                <div class="form-row">
                    <div class="form-group">
                        <label for="episodeVideoUrl">Đường dẫn URL Video <span class="required">*</span></label>
                        <input id="episodeVideoUrl" type="url" name="assetUrl" class="form-control" required
                               placeholder="https://res.cloudinary.com/.../video/upload/v.../episode.mp4" />
                    </div>
                </div>
                <div style="text-align:right;margin-top:15px;">
                    <button type="submit" class="btn btn-secondary">Lưu URL Video</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/content-manager/series-form.js}"></script>

</body>
</html>
