<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${bannerRequest.id != null} ? 'Cập nhật banner' : 'Tạo banner mới'">Banner</title>
    <link rel="stylesheet" th:href="@{/css/content-manager/content-manager-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/content-manager/web-content.css}" />
</head>

<body>
    <div th:replace="~{content-manager/fragments/sidebar :: sidebar(activeMenu='web-content')}"></div>

    <div class="admin-content">
        <header class="admin-header">
            <h2 th:text="${bannerRequest.id != null} ? 'Cập nhật banner' : 'Tạo banner mới'">Tạo banner</h2>
            <div class="header-actions">
                <a th:href="@{/content-manager/web-content?tab=banners}" class="btn btn-secondary btn-sm">Quay lại</a>
            </div>
        </header>

        <div class="webcontent-tabs">
            <a th:href="@{/content-manager/web-content(tab='banners')}" class="active">Banner trang chủ</a>
            <a th:href="@{/content-manager/web-content(tab='static-pages')}">Trang tĩnh</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="form-card">
            <form th:action="${bannerRequest.id != null}
                        ? @{/content-manager/web-content/banners/{id}(id=${bannerRequest.id})}
                        : @{/content-manager/web-content/banners}"
                  th:object="${bannerRequest}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{existingImagePath}" />

                <div class="form-section">
                    <div class="form-section-title">Thông tin banner</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Tiêu đề <span class="required">*</span></label>
                            <input id="title" type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" />
                            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="targetType">Kiểu điều hướng</label>
                            <select id="targetType" th:field="*{targetType}" class="form-control">
                                <option th:each="type : ${bannerTargetTypes}"
                                        th:value="${type}"
                                        th:text="${type.displayLabel}"></option>
                            </select>
                            <div style="color: var(--netflix-light-grey); font-size: 13px; margin-top: 8px;">
                                Chọn nội dung đích, hệ thống sẽ tự sinh link điều hướng cho banner.
                            </div>
                        </div>
                    </div>

                    <div class="form-row" data-target-group="MOVIE">
                        <div class="form-group">
                            <label for="movieTargetId">Phim đích</label>
                            <select id="movieTargetId" th:field="*{movieTargetId}" class="form-control">
                                <option value="">-- Chọn phim --</option>
                                <option th:each="movie : ${availableMovies}"
                                        th:value="${movie.value}"
                                        th:text="${movie.label}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row" data-target-group="SERIES">
                        <div class="form-group">
                            <label for="seriesTargetId">Series đích</label>
                            <select id="seriesTargetId" th:field="*{seriesTargetId}" class="form-control">
                                <option value="">-- Chọn series --</option>
                                <option th:each="series : ${availableSeries}"
                                        th:value="${series.value}"
                                        th:text="${series.label}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row" data-target-group="STATIC_PAGE">
                        <div class="form-group">
                            <label for="staticPageTarget">Trang tĩnh đích</label>
                            <select id="staticPageTarget" th:field="*{staticPageTarget}" class="form-control">
                                <option value="">-- Chọn trang tĩnh --</option>
                                <option th:each="page : ${availableStaticPages}"
                                        th:value="${page.value}"
                                        th:text="${page.label}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row" data-target-group="EXTERNAL_URL">
                        <div class="form-group">
                            <label for="externalUrl">URL tùy chỉnh</label>
                            <input id="externalUrl" type="text" th:field="*{externalUrl}" class="form-control"
                                   placeholder="VD: /plans hoặc https://example.com" />
                        </div>
                    </div>

                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="displayOrder">Thứ tự hiển thị <span class="required">*</span></label>
                            <input id="displayOrder" type="number" th:field="*{displayOrder}" min="1"
                                   class="form-control" />
                        </div>
                        <div class="form-group">
                            <label for="isDisplayed">Trạng thái</label>
                            <select id="isDisplayed" th:field="*{isDisplayed}" class="form-control">
                                <option th:value="true">Đang hiển thị</option>
                                <option th:value="false">Đã ẩn</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">Ảnh banner (local)</div>

                    <div class="form-row two-col">
                        <div class="form-group">
                            <label for="bannerImage">Chọn ảnh <span class="required">*</span></label>
                            <input id="bannerImage" type="file" th:field="*{bannerImage}" class="form-control"
                                   accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                                   th:required="${bannerRequest.id == null}" />
                            <div style="color: var(--netflix-light-grey); font-size: 13px; margin-top: 8px;">
                                Chỉ nhận `jpg`, `jpeg`, `png`, `webp` (tối đa 5MB).
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Preview ảnh hiện tại</label>
                            <img th:if="${bannerRequest.existingImagePath != null and !#strings.isEmpty(bannerRequest.existingImagePath)}"
                                 th:src="@{/uploads/{path}(path=${bannerRequest.existingImagePath})}"
                                 class="banner-thumb" alt="Banner preview" />
                            <div th:if="${bannerRequest.existingImagePath == null or #strings.isEmpty(bannerRequest.existingImagePath)}"
                                 style="color: var(--netflix-light-grey);">Chưa có ảnh</div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/content-manager/web-content?tab=banners}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary"
                            th:text="${bannerRequest.id != null} ? 'Lưu thay đổi' : 'Tạo banner'">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            const targetTypeField = document.getElementById('targetType');
            const groups = Array.from(document.querySelectorAll('[data-target-group]'));
            if (!targetTypeField || groups.length === 0) return;

            function syncTargetGroups() {
                const activeType = targetTypeField.value || 'NONE';

                groups.forEach(group => {
                    const isActive = group.getAttribute('data-target-group') === activeType;
                    group.hidden = !isActive;
                    group.querySelectorAll('input, select').forEach(field => {
                        field.disabled = !isActive;
                    });
                });
            }

            targetTypeField.addEventListener('change', syncTargetGroups);
            syncTargetGroups();
        })();
    </script>
</body>

</html>
