<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tham gia phòng riêng tư</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #090b10;
            color: #f3f5f9;
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
        }

        .box {
            width: min(420px, calc(100% - 24px));
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #121623;
            padding: 16px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        p {
            margin: 0 0 12px;
            color: #b5bcc9;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: #1a2030;
            color: #fff;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .row {
            display: inline-flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #fff;
            height: 38px;
            padding: 0 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .msg {
            margin: 0 0 10px;
            color: #ffb3b8;
            font-size: 13px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
<section class="box">
    <h1>Phòng riêng tư</h1>
    <p>Phòng <strong th:text="${roomName}">Room</strong> yêu cầu mật khẩu để tham gia.</p>
    <p class="msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form th:action="@{/join/{roomCode}(roomCode=${roomCode})}" method="post">
        <label class="visually-hidden" for="joinRoomPassword">Mat khau phong</label>
        <input id="joinRoomPassword" type="password" name="password" placeholder="Nhập mật khẩu phòng" required>
        <div class="row">
            <button class="btn" type="submit">Tham gia ngay</button>
            <a class="btn" href="/watch-together">Quay lại</a>
        </div>
    </form>
</section>
</body>
</html>
