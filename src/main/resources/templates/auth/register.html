<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng ký - LoveStream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

    <div class="header">
        <a href="/" class="logo">LoveStream</a>
    </div>

    <div class="auth-wrapper">
        <div class="auth-box wide">
            <h2>Đăng ký</h2>

            <div id="error-alert" class="alert alert-error"></div>

            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="fullName" class="form-control" placeholder="Họ và tên" required
                        autocomplete="name">
                </div>
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Địa chỉ email" required
                        autocomplete="email">
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" class="form-control" placeholder="Số điện thoại" required
                        autocomplete="tel">
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" id="password" class="form-control pr-40"
                        placeholder="Mật khẩu (ít nhất 6 ký tự)" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="toggleVis('password', this)"
                        aria-label="Hiện mật khẩu">
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <svg class="eye-open" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20"
                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <div class="form-group password-wrapper">
                    <input type="password" id="confirmPassword" class="form-control pr-40"
                        placeholder="Xác nhận mật khẩu" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-password" onclick="toggleVis('confirmPassword', this)"
                        aria-label="Hiện mật khẩu">
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <svg class="eye-open" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20"
                            height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">Tạo tài khoản</button>
            </form>

            <div class="divider">hoặc đăng ký nhanh bằng</div>

            <a href="/oauth2/authorization/google" class="btn btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Đăng ký bằng Google
            </a>
            <p class="google-note">Tài khoản sẽ tự động được tạo nếu email chưa tồn tại.</p>

            <div class="auth-prompt">
                Đã có tài khoản?<a href="/login">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script>
        function toggleVis(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeClosed = btn.querySelector('.eye-closed');
            const eyeOpen = btn.querySelector('.eye-open');

            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);

            if (type === 'text') {
                eyeClosed.style.display = 'none';
                eyeOpen.style.display = 'block';
            } else {
                eyeClosed.style.display = 'block';
                eyeOpen.style.display = 'none';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorAlert = document.getElementById('error-alert');
            const submitBtn = document.getElementById('submitBtn');

            errorAlert.style.display = 'none';

            if (password !== confirmPassword) {
                errorAlert.innerText = 'Mật khẩu và xác nhận mật khẩu không khớp!';
                errorAlert.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang xử lý...';

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, phone, password })
                });

                const data = await response.json();

                if (response.ok) {
                    sessionStorage.setItem('verifyEmail', email);
                    window.location.href = '/verify-email';
                } else {
                    errorAlert.innerText = data.error || 'Đăng ký thất bại. Vui lòng thử lại.';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                errorAlert.innerText = 'Lỗi kết nối đến máy chủ.';
                errorAlert.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Tạo tài khoản';
            }
        });
    </script>
</body>

</html>
