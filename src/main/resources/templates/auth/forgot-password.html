<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - LoveStream</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: rgba(0,0,0,0.75); padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; }
        .login-box h2 { margin-bottom: 10px; }
        .description { font-size: 14px; color: #b3b3b3; margin-bottom: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 12px; border: none; border-radius: 4px; background: #333; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background-color: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background-color: #f40612; }
        .btn-login:disabled { background-color: #555; cursor: not-allowed; }
        .btn-secondary { width: 100%; padding: 12px; background-color: transparent; color: #b3b3b3; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-secondary:hover { border-color: #888; color: #fff; }
        .btn-secondary:disabled { opacity: 0.65; cursor: not-allowed; }
        .error-message { color: #e87c03; margin-bottom: 15px; font-size: 14px; display: none; }
        .success-message { color: #28a745; margin-bottom: 15px; font-size: 14px; display: none; }
        .otp-section { display: none; margin-top: 12px; }
        .reset-section { display: none; margin-top: 12px; }
        .hint { color: #9f9f9f; font-size: 13px; margin-bottom: 10px; }
        .links { margin-top: 20px; display: flex; justify-content: center; font-size: 14px; }
        .links a { color: #b3b3b3; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Quên mật khẩu</h2>
    <p class="description">
        Vui lòng nhập địa chỉ email bạn đã sử dụng để đăng ký. Chúng tôi sẽ gửi cho bạn một mã xác minh để đặt lại mật khẩu.
    </p>

    <div id="error-alert" class="error-message"></div>
    <div id="success-alert" class="success-message"></div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <button type="submit" class="btn-login" id="submitBtn">Gửi mã xác nhận</button>
    </form>

    <div id="otpSection" class="otp-section">
        <p class="hint">Nhập OTP đã được gửi tới email của bạn.</p>
        <form id="verifyOtpForm">
            <div class="form-group">
                <input type="text" id="otp" class="form-control" placeholder="Nhập mã OTP" maxlength="6" required>
            </div>
            <button type="submit" class="btn-login" id="verifyBtn">Xác minh OTP</button>
        </form>
        <button type="button" class="btn-secondary" id="resendBtn">Gửi lại OTP</button>
    </div>

    <div id="resetSection" class="reset-section">
        <p class="hint">OTP hợp lệ. Vui lòng nhập mật khẩu mới.</p>
        <form id="resetPasswordForm">
            <div class="form-group">
                <input type="password" id="newPassword" class="form-control" placeholder="Mật khẩu mới (ít nhất 6 ký tự)" minlength="6" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" minlength="6" required>
            </div>
            <button type="submit" class="btn-login" id="resetBtn">Đặt lại mật khẩu</button>
        </form>
    </div>

    <div class="links">
        <a href="/login">Quay lại trang Đăng nhập</a>
    </div>
</div>

<script>
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const verifyOtpForm = document.getElementById('verifyOtpForm');
    const resetPasswordForm = document.getElementById('resetPasswordForm');
    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');

    const submitBtn = document.getElementById('submitBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const resetBtn = document.getElementById('resetBtn');

    const otpSection = document.getElementById('otpSection');
    const resetSection = document.getElementById('resetSection');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');

    let resendCountdown = null;
    let remainingSeconds = 0;
    let verifiedOtpToken = null;

    function showError(message) {
        successAlert.style.display = 'none';
        errorAlert.innerText = message;
        errorAlert.style.display = 'block';
    }

    function showSuccess(message) {
        errorAlert.style.display = 'none';
        successAlert.innerText = message;
        successAlert.style.display = 'block';
    }

    function setResendCooldown(seconds) {
        if (resendCountdown) {
            clearInterval(resendCountdown);
        }

        remainingSeconds = seconds;
        resendBtn.disabled = true;
        resendBtn.innerText = `Gửi lại OTP (${remainingSeconds}s)`;

        resendCountdown = setInterval(() => {
            remainingSeconds -= 1;
            if (remainingSeconds <= 0) {
                clearInterval(resendCountdown);
                resendCountdown = null;
                resendBtn.disabled = false;
                resendBtn.innerText = 'Gửi lại OTP';
                return;
            }
            resendBtn.innerText = `Gửi lại OTP (${remainingSeconds}s)`;
        }, 1000);
    }

    async function sendOtp(email) {
        const response = await fetch('/api/v1/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || 'Không thể gửi yêu cầu. Vui lòng kiểm tra lại email.');
        }

        return data;
    }

    forgotPasswordForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        if (!email) {
            showError('Vui lòng nhập email.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Đang gửi...';
        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        try {
            const data = await sendOtp(email);
            showSuccess(data.message || 'Mã xác nhận đã được gửi đến email của bạn.');

            // Giữ nguyên email, chỉ hiện thêm vùng OTP
            otpSection.style.display = 'block';
            emailInput.readOnly = true;
            submitBtn.style.display = 'none';
            otpInput.focus();
            setResendCooldown(30);
        } catch (error) {
            showError(error.message || 'Lỗi kết nối đến máy chủ.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Gửi mã xác nhận';
        }
    });

    resendBtn.addEventListener('click', async function () {
        const email = emailInput.value.trim();
        if (!email) {
            showError('Vui lòng nhập email trước khi gửi lại OTP.');
            return;
        }

        resendBtn.disabled = true;
        resendBtn.innerText = 'Đang gửi lại...';

        try {
            const data = await sendOtp(email);
            showSuccess(data.message || 'Mã OTP mới đã được gửi.');
            setResendCooldown(30);
        } catch (error) {
            showError(error.message || 'Không thể gửi lại OTP.');
            resendBtn.disabled = false;
            resendBtn.innerText = 'Gửi lại OTP';
        }
    });

    verifyOtpForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const otp = otpInput.value.trim().toUpperCase();
        if (!otp) {
            showError('Vui lòng nhập mã OTP.');
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerText = 'Đang xác minh...';

        try {
            const response = await fetch('/api/v1/auth/verify-forgot-password-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: otp })
            });

            const data = await response.json();
            if (!response.ok) {
                showError(data.error || 'OTP không hợp lệ hoặc đã hết hạn.');
                return;
            }

            verifiedOtpToken = otp;
            showSuccess('Xác minh OTP thành công. Vui lòng đặt mật khẩu mới.');

            // Ẩn các input cũ liên quan tới email/otp sau khi OTP hợp lệ
            forgotPasswordForm.style.display = 'none';
            otpSection.style.display = 'none';
            emailInput.readOnly = true;
            resetSection.style.display = 'block';
            newPasswordInput.focus();
        } catch (error) {
            showError('Lỗi kết nối đến máy chủ.');
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.innerText = 'Xác minh OTP';
        }
    });

    resetPasswordForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!verifiedOtpToken) {
            showError('Bạn cần xác minh OTP trước khi đặt lại mật khẩu.');
            return;
        }

        if (newPassword.length < 6) {
            showError('Mật khẩu mới phải có ít nhất 6 ký tự.');
            return;
        }

        if (newPassword !== confirmPassword) {
            showError('Mật khẩu và nhập lại mật khẩu không trùng nhau.');
            return;
        }

        resetBtn.disabled = true;
        resetBtn.innerText = 'Đang đặt lại...';
        errorAlert.style.display = 'none';

        try {
            const response = await fetch('/api/v1/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: verifiedOtpToken, newPassword: newPassword })
            });

            const data = await response.json();
            if (!response.ok) {
                showError(data.error || 'Không thể đặt lại mật khẩu.');
                return;
            }

            showSuccess(data.message || 'Đổi mật khẩu thành công. Đang chuyển về trang đăng nhập...');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1200);
        } catch (error) {
            showError('Lỗi kết nối đến máy chủ.');
        } finally {
            resetBtn.disabled = false;
            resetBtn.innerText = 'Đặt lại mật khẩu';
        }
    });
</script>
</body>
</html>
