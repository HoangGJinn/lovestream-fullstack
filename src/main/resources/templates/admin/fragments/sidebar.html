<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:fragment="sidebar(activeMenu)" class="admin-sidebar">
    <div class="admin-logo">LoveStream Admin</div>
    <div class="admin-menu">
        <a th:href="@{/admin/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active'">Dashboard</a>
        <a th:href="@{/admin/users}" th:classappend="${activeMenu == 'users'} ? 'active'">Quan ly nguoi dung</a>
        <a th:href="@{/admin/plans}" th:classappend="${activeMenu == 'plans'} ? 'active'">Quan ly goi dich vu</a>
        <a th:href="@{/admin/vouchers}" th:classappend="${activeMenu == 'vouchers'} ? 'active'">Quan ly voucher</a>
        <a th:href="@{/admin/transactions}" th:classappend="${activeMenu == 'transactions'} ? 'active'">Quan ly giao dich</a>

        <a href="#" onclick="handleAdminLogout(event)" style="margin-top: 50px; color: var(--netflix-red);">Dang xuat</a>
    </div>

    <script>
        function handleAdminLogout(event) {
            event.preventDefault();
            fetch('/api/v1/auth/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = data.redirectUrl ? data.redirectUrl : '/login';
            })
            .catch(error => {
                console.error('Loi khi dang xuat:', error);
                window.location.href = '/login';
            });
        }
    </script>
</div>
</body>

</html>
