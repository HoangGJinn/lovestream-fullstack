<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin/admin-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/movies/movies.css}" />
</head>
<body>

<div class="admin-container">
    <header class="admin-header">
        <h1>🎬 Quản lý Phim Lẻ</h1>
        <div class="header-actions">
            <a th:href="@{/admin/movies/new}" class="btn btn-primary">+ Tạo phim mới</a>
            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">← Dashboard</a>
        </div>
    </header>

    <div class="admin-content">

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

        <!-- Filter Bar -->
        <form method="get" th:action="@{/admin/movies}" class="filter-bar">
            <div class="form-group">
                <label for="keyword">Tìm kiếm tên phim</label>
                <input id="keyword" name="keyword" type="text" class="form-control"
                       placeholder="Nhập tên phim..."
                       th:value="${currentKeyword}" />
            </div>
            <div class="form-group">
                <label for="status">Trạng thái</label>
                <select id="status" name="status" class="form-control">
                    <option value="">-- Tất cả --</option>
                    <option th:each="s : ${allStatuses}"
                            th:value="${s}"
                            th:text="${s}"
                            th:selected="${s == currentStatus}">
                    </option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            <a th:href="@{/admin/movies}" class="btn btn-secondary">Xóa lọc</a>
        </form>

        <!-- Movie Table -->
        <div class="card">
            <table class="table">
                <thead>
                    <tr>
                        <th>Poster</th>
                        <th>Tên phim</th>
                        <th>Năm</th>
                        <th>Thời lượng</th>
                        <th>Chất lượng</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Empty state -->
                    <tr th:if="${#lists.isEmpty(movies)}">
                        <td colspan="7" class="empty-state">Chưa có phim nào. Hãy tạo phim đầu tiên!</td>
                    </tr>

                    <tr th:each="movie : ${movies}">
                        <!-- Poster -->
                        <td>
                            <img class="poster-thumb"
                                 th:if="${movie.posterUrl != null and !movie.posterUrl.contains('placeholder')}"
                                 th:src="${movie.posterUrl}"
                                 th:alt="${movie.title}" />
                            <div class="poster-thumb--placeholder"
                                 th:unless="${movie.posterUrl != null and !movie.posterUrl.contains('placeholder')}">
                                No Img
                            </div>
                        </td>

                        <!-- Info -->
                        <td>
                            <strong th:text="${movie.title}">Tên phim</strong>
                        </td>
                        <td th:text="${movie.releaseYear}">2023</td>
                        <td th:text="${movie.durationMinutes + ' phút'}">120 phút</td>
                        <td th:text="${movie.quality}">HD</td>

                        <!-- Status badge -->
                        <td>
                            <span class="badge"
                                  th:classappend="${movie.status == T(com.hcmute.lovestream.entity.enums.ContentStatus).ACTIVE} ? 'badge-active' : 'badge-hidden'"
                                  th:text="${movie.status == T(com.hcmute.lovestream.entity.enums.ContentStatus).ACTIVE} ? 'Đang chiếu' : 'Đã ẩn'">
                            </span>
                        </td>

                        <!-- Actions -->
                        <td class="actions">
                            <a th:href="@{/admin/movies/{id}/edit(id=${movie.id})}" class="btn btn-secondary btn-sm">✏️ Sửa</a>

                            <!-- Hide -->
                            <form th:if="${movie.status == T(com.hcmute.lovestream.entity.enums.ContentStatus).ACTIVE}"
                                  th:action="@{/admin/movies/{id}/hide(id=${movie.id})}" method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Bạn có chắc muốn ẩn bộ phim này?')">
                                <button class="btn btn-warning btn-sm" type="submit">🙈 Ẩn</button>
                            </form>

                            <!-- Restore -->
                            <form th:if="${movie.status == T(com.hcmute.lovestream.entity.enums.ContentStatus).HIDDEN}"
                                  th:action="@{/admin/movies/{id}/restore(id=${movie.id})}" method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Khôi phục bộ phim này?')">
                                <button class="btn btn-success btn-sm" type="submit">♻️ Khôi phục</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination-bar" th:if="${moviePage != null and moviePage.totalPages > 1}">
                <a class="btn btn-secondary btn-sm"
                   th:if="${!moviePage.first}"
                   th:href="@{/admin/movies(status=${currentStatus},keyword=${currentKeyword},page=${currentPage - 1},size=${pageSize})}">
                    ← Trang trước
                </a>
                <span>
                    Trang <strong th:text="${currentPage + 1}">1</strong> /
                    <strong th:text="${moviePage.totalPages}">1</strong>
                    (<span th:text="${moviePage.totalElements}">0</span> phim)
                </span>
                <a class="btn btn-secondary btn-sm"
                   th:if="${!moviePage.last}"
                   th:href="@{/admin/movies(status=${currentStatus},keyword=${currentKeyword},page=${currentPage + 1},size=${pageSize})}">
                    Trang sau →
                </a>
            </div>
        </div>

    </div><!-- /.admin-content -->
</div><!-- /.admin-container -->

</body>
</html>
