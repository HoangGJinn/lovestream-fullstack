<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/admin/admin-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/movies/movies.css}" />
</head>
<body>

<div class="admin-container">
    <header class="admin-header">
        <h1 th:text="${movieUpsertRequest.id != null} ? '✏️ Cập nhật phim' : '+ Tạo phim mới'">Form Phim</h1>
        <div class="header-actions">
            <a th:href="@{/admin/movies}" class="btn btn-secondary">← Danh sách phim</a>
        </div>
    </header>

    <div class="admin-content">

        <!-- Flash Messages (visible after redirect from create/update) -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

        <!-- ────────────────────────────────────────────────────
             FORM 1: Create / Update movie metadata
             ──────────────────────────────────────────────────── -->
        <div class="form-card">
            <form th:action="${movieUpsertRequest.id != null}
                        ? @{/admin/movies/{id}(id=${movieUpsertRequest.id})}
                        : @{/admin/movies}"
                  th:object="${movieUpsertRequest}"
                  method="post">

                <!-- Global Binding Errors -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <!-- Hidden ID for Update -->
                <input type="hidden" th:field="*{id}" />

                <!-- ── Thông tin cơ bản ──────────────────────── -->
                <div class="form-section">
                    <div class="form-section-title">Thông tin cơ bản</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Tên phim <span class="required">*</span></label>
                            <input id="title" type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">Mô tả <span class="required">*</span></label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                            <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                        </div>
                    </div>

                    <div class="form-row three-col">
                        <div class="form-group">
                            <label for="releaseYear">Năm phát hành <span class="required">*</span></label>
                            <input id="releaseYear" type="number" th:field="*{releaseYear}" class="form-control"
                                   placeholder="VD: 2024"
                                   th:classappend="${#fields.hasErrors('releaseYear')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></span>
                        </div>

                        <div class="form-group">
                            <label for="releaseDate">Ngày chiếu chính thức <span class="required">*</span></label>
                            <input id="releaseDate" type="date" th:field="*{releaseDate}" class="form-control"
                                   th:classappend="${#fields.hasErrors('releaseDate')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}"></span>
                        </div>

                        <div class="form-group">
                            <label for="durationMinutes">Thời lượng (phút) <span class="required">*</span></label>
                            <input id="durationMinutes" type="number" th:field="*{durationMinutes}" class="form-control"
                                   min="1" placeholder="VD: 120"
                                   th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'" />
                            <span class="field-error" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></span>
                        </div>
                    </div>
                </div>

                <!-- ── Phân loại ──────────────────────────────── -->
                <div class="form-section">
                    <div class="form-section-title">Phân loại &amp; Trạng thái</div>

                    <div class="form-row three-col">
                        <div class="form-group">
                            <label for="ageRating">Phân loại độ tuổi <span class="required">*</span></label>
                            <select id="ageRating" th:field="*{ageRating}" class="form-control"
                                    th:classappend="${#fields.hasErrors('ageRating')} ? 'is-invalid'">
                                <option value="">-- Chọn --</option>
                                <option th:each="r : ${allAgeRatings}" th:value="${r}" th:text="${r}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('ageRating')}" th:errors="*{ageRating}"></span>
                        </div>

                        <div class="form-group">
                            <label for="quality">Chất lượng <span class="required">*</span></label>
                            <select id="quality" th:field="*{quality}" class="form-control"
                                    th:classappend="${#fields.hasErrors('quality')} ? 'is-invalid'">
                                <option value="">-- Chọn --</option>
                                <option th:each="q : ${allQualities}" th:value="${q}" th:text="${q}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('quality')}" th:errors="*{quality}"></span>
                        </div>

                        <div class="form-group">
                            <label for="status">Trạng thái <span class="required">*</span></label>
                            <select id="status" th:field="*{status}" class="form-control"
                                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                                <option value="">-- Chọn --</option>
                                <option th:each="s : ${allStatuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                        </div>
                    </div>
                </div>

                <!-- ── Thể loại ────────────────────────────────── -->
                <div class="form-section">
                    <div class="form-section-title">Thể loại <span class="required">*</span></div>
                    <div class="genre-grid">
                        <label class="genre-checkbox" th:each="genre : ${allGenres}">
                            <input type="checkbox"
                                   name="genreIds"
                                   th:value="${genre.id}"
                                   th:checked="${movieUpsertRequest.genreIds != null and movieUpsertRequest.genreIds.contains(genre.id)}" />
                            <span th:text="${genre.name}">Thể loại</span>
                        </label>
                    </div>
                    <!-- Genre validation error — displayed prominently -->
                    <div th:if="${#fields.hasErrors('genreIds')}" class="alert alert-danger" style="margin-top: 8px;">
                        <span th:errors="*{genreIds}"></span>
                    </div>
                </div>

                <!-- ── Actions ───────────────────────────────────── -->
                <div class="form-actions">
                    <a th:href="@{/admin/movies}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${movieUpsertRequest.id != null} ? '💾 Cập nhật' : '✅ Tạo phim'">Lưu</span>
                    </button>
                </div>

            </form>
        </div><!-- /.form-card (metadata form) -->

        <!-- ────────────────────────────────────────────────────
             FORM 2: Upload asset — chỉ hiển thị khi đang edit
             (Tách hoàn toàn khỏi form metadata để tránh nested form)
             ──────────────────────────────────────────────────── -->
        <div class="form-card" th:if="${movieUpsertRequest.id != null}">
            <form th:action="@{/admin/movies/{id}/assets(id=${movieUpsertRequest.id})}"
                  method="post"
                  enctype="multipart/form-data"
                  class="upload-section">

                <div class="form-section-title">📎 Upload Tài nguyên Media</div>

                <div class="form-row two-col">
                    <div class="form-group">
                        <label for="assetType">Loại tài nguyên <span class="required">*</span></label>
                        <select id="assetType" name="assetType" class="form-control" required>
                            <option value="">-- Chọn loại --</option>
                            <option th:each="at : ${allAssetTypes}" th:value="${at}" th:text="${at}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="uploadFile">Chọn file <span class="required">*</span></label>
                        <input id="uploadFile" type="file" name="file" class="form-control" required
                               accept="image/*,video/*" />
                    </div>
                </div>
                <div style="text-align: right;">
                    <button type="submit" class="btn btn-primary">⬆️ Upload</button>
                </div>

            </form>
        </div><!-- /.form-card (upload form) -->

        <!-- Gợi ý khi đang tạo mới: nhắc user lưu phim trước -->
        <div class="form-card" th:if="${movieUpsertRequest.id == null}">
            <p style="margin: 0; color: #555;">
                💡 <strong>Lưu phim trước</strong> để tải lên tài nguyên media (poster, trailer, video).
            </p>
        </div>

    </div><!-- /.admin-content -->
</div><!-- /.admin-container -->

</body>
</html>
