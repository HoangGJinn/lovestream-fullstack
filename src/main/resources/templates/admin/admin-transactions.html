<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Quản lý Giao dịch</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --netflix-black: #141414;
            --netflix-dark-grey: #2f2f2f;
            --netflix-light-grey: #b3b3b3;
            --text-white: #ffffff;
            --success-green: #46d369;
            --warning-yellow: #f5a442;
        }

        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: var(--netflix-black); color: var(--text-white); display: flex; }

        /* Sidebar */
        .admin-sidebar { width: 250px; height: 100vh; background-color: rgba(0, 0, 0, 0.9); padding: 20px 0; position: fixed; border-right: 1px solid var(--netflix-dark-grey); }
        .admin-logo { color: var(--netflix-red); font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 40px; letter-spacing: 2px; }
        .admin-menu a { display: block; padding: 15px 25px; color: var(--netflix-light-grey); text-decoration: none; font-size: 16px; transition: all 0.3s; }
        .admin-menu a:hover, .admin-menu a.active { color: var(--text-white); background-color: var(--netflix-dark-grey); border-left: 4px solid var(--netflix-red); }

        /* Main Content */
        .admin-content { margin-left: 250px; padding: 30px; width: calc(100% - 250px); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        /* Summary Cards */
        .summary-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .summary-card { background-color: var(--netflix-dark-grey); padding: 20px; border-radius: 8px; flex: 1; border-left: 4px solid var(--netflix-red); }
        .summary-title { color: var(--netflix-light-grey); font-size: 14px; margin-bottom: 10px; }
        .summary-value { font-size: 32px; font-weight: bold; color: var(--success-green); }

        /* --- THANH BỘ LỌC (FILTER BAR) --- */
        .filter-bar { background-color: var(--netflix-dark-grey); padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 13px; color: var(--netflix-light-grey); }
        .filter-input { background-color: #000; color: white; border: 1px solid #404040; padding: 8px 12px; border-radius: 4px; font-size: 14px; outline: none; }
        .filter-input:focus { border-color: var(--netflix-red); }
        .btn-filter { background-color: var(--netflix-red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; height: 36px; }
        .btn-filter:hover { background-color: #f40612; }

        /* Table */
        .table-container { background-color: var(--netflix-dark-grey); padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #404040; }
        th { color: var(--netflix-light-grey); font-weight: normal; }

        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .status-success { color: var(--success-green); background-color: rgba(70, 211, 105, 0.1); }
        .status-pending { color: var(--warning-yellow); background-color: rgba(245, 164, 66, 0.1); }
        .status-failed { color: var(--netflix-red); background-color: rgba(229, 9, 20, 0.1); }
        .plan-badge { background-color: #555; padding: 4px 8px; border-radius: 4px; font-size: 12px;}
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar(activeMenu='transactions')}"></div>

<div class="admin-content">
    <div class="admin-header">
        <h2 id="pageTitleText">Quản lý Giao dịch</h2>
        <div>Xin chào, <b>Admin</b></div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Từ ngày</label>
            <input type="date" id="fromDate" class="filter-input">
        </div>
        <div class="filter-group">
            <label>Đến ngày</label>
            <input type="date" id="toDate" class="filter-input">
        </div>
        <div class="filter-group">
            <label>Gói dịch vụ</label>
            <select id="planFilter" class="filter-input">
                <option value="ALL">Tất cả gói</option>
                <option value="Basic Plan">Basic Plan</option>
                <option value="Standard Plan">Standard Plan</option>
                <option value="Premium Plan">Premium Plan</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Trạng thái</label>
            <select id="statusFilter" class="filter-input">
                <option value="ALL">Tất cả trạng thái</option>
                <option value="SUCCESS">Thành công</option>
                <option value="PENDING">Đang xử lý</option>
                <option value="FAILED">Thất bại</option>
            </select>
        </div>
        <button class="btn-filter" onclick="applyFilter()">Lọc Dữ Liệu</button>
    </div>

    <div class="summary-container">
        <div class="summary-card">
            <div class="summary-title" id="revenueLabel">Tổng Doanh Thu (Theo bộ lọc)</div>
            <div class="summary-value" id="totalRevenue">Đang tính...</div>
        </div>
        <div class="summary-card" style="border-left-color: #4287f5;">
            <div class="summary-title">Số lượng Giao dịch</div>
            <div class="summary-value" id="totalCount" style="color: white;">Đang đếm...</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>Mã GD (ID)</th>
                <th>Người dùng (User ID)</th>
                <th>Gói đăng ký</th>
                <th>Số tiền</th>
                <th>Thời gian</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody id="transactionTableBody">
            <tr><td colspan="6" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Khi trang vừa load lên, gọi hàm lọc với giá trị mặc định (rỗng = lấy tháng hiện tại)
    document.addEventListener('DOMContentLoaded', () => {
        applyFilter();
    });

    // Hàm thu thập dữ liệu từ Form và gọi API
    function applyFilter() {
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;
        const plan = document.getElementById('planFilter').value;
        const status = document.getElementById('statusFilter').value;

        // Đổi tiêu đề cho phù hợp
        if(fromDate && toDate) {
            document.getElementById('revenueLabel').innerText = `Tổng Doanh Thu (${fromDate} đến ${toDate})`;
        } else {
            document.getElementById('revenueLabel').innerText = `Tổng Doanh Thu (Tháng hiện tại)`;
        }

        // Tạo chuỗi query URL
        const queryParams = new URLSearchParams({
            fromDate: fromDate,
            toDate: toDate,
            plan: plan,
            status: status
        });

        // Gọi API lọc mới
        fetch('/api/v1/admin/payments/filter?' + queryParams.toString())
            .then(res => res.json())
            .then(data => {
                renderTable(data);
                calculateSummary(data);
            })
            .catch(err => {
                console.error("Lỗi tải dữ liệu", err);
                document.getElementById('transactionTableBody').innerHTML =
                    '<tr><td colspan="6" style="text-align:center; color: red;">Lỗi kết nối đến máy chủ!</td></tr>';
            });
    }

    // Các hàm Render dưới này giữ nguyên như cũ
    function renderTable(transactions) {
        const tbody = document.getElementById('transactionTableBody');
        tbody.innerHTML = '';

        if(transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Không tìm thấy giao dịch nào phù hợp với bộ lọc.</td></tr>';
            return;
        }

        transactions.forEach(t => {
            const formattedAmount = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(t.amount);
            const dateObj = new Date(t.paymentDate);
            const formattedDate = dateObj.toLocaleString('vi-VN');

            let statusHtml = '';
            if (t.status === 'SUCCESS' || t.status === 'COMPLETED') {
                statusHtml = `<span class="status-badge status-success">Thành công</span>`;
            } else if (t.status === 'PENDING') {
                statusHtml = `<span class="status-badge status-pending">Đang xử lý</span>`;
            } else {
                statusHtml = `<span class="status-badge status-failed">Thất bại</span>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td style="color: var(--netflix-light-grey); font-size: 13px;" title="${t.id}">${t.id.substring(0, 8)}...</td>
                    <td style="font-size: 14px;" title="${t.userId}">${t.userId.substring(0, 8)}...</td>
                    <td><span class="plan-badge">${t.planName}</span></td>
                    <td style="font-weight: bold;">${formattedAmount}</td>
                    <td>${formattedDate}</td>
                    <td>${statusHtml}</td>
                </tr>
            `;
        });
    }

    function calculateSummary(transactions) {
        const successfulTransactions = transactions.filter(t => t.status === 'SUCCESS' || t.status === 'COMPLETED');
        const totalAmount = successfulTransactions.reduce((sum, t) => sum + t.amount, 0);

        document.getElementById('totalCount').innerText = successfulTransactions.length + ' thành công (trên tổng ' + transactions.length + ')';
        document.getElementById('totalRevenue').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(totalAmount);
    }
</script>
</body>
</html>
