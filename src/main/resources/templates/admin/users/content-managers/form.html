<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo mới Content Manager</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin-theme.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/users/content-managers.css}" />
</head>
<body>

<div class="admin-container">
    <header class="admin-header">
        <h1>Tạo Content Manager mới</h1>
        <div class="header-actions">
            <a th:href="@{/admin/users/content-managers}" class="btn btn-secondary">Quay lại danh sách</a>
        </div>
    </header>

    <div class="admin-content">
        <div class="card form-card">
            
            <form th:action="@{/admin/users/content-managers}" th:object="${createContentManagerRequest}" method="post">
                
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <div class="form-group">
                    <label for="fullName">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" />
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email đăng nhập <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" />
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại <span class="required">*</span></label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control" />
                    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu <span class="required">*</span></label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" />
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" />
                    <!-- Hiển thị lỗi từ PasswordMatchingValidator -->
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error-msg"></span>
                </div>

                <div class="form-actions border-top">
                    <button type="submit" class="btn btn-primary">Tạo tài khoản</button>
                    <a th:href="@{/admin/users/content-managers}" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
