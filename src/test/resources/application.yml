# Test configuration - uses H2 in-memory database
# Ensures tests are fully isolated from the production/dev MySQL database.
# Overrides src/main/resources/application.yml for the test classpath.

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Disable mail auto-configuration for tests (no real SMTP needed)
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

  # Disable OAuth2 for test context (no real Google/OAuth flow in tests)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile

# Cloudinary placeholders — no real API calls happen in tests (service is mocked)
cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret

# JWT config for test
jwt:
  secret: test-secret-key-at-least-256-bits-long-for-hs256-algorithm-padding
  expiration: 86400000
